name: Mover projeto para a raiz


on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mover:
    name: Mover conteúdo de 02-OfflineAppTemplate
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mover conteúdo para a raiz
        run: |
          shopt -s dotglob nullglob

          for item in 02-OfflineAppTemplate/*; do
            name=$(basename "$item")

            if [ "$name" != "." ] && [ "$name" != ".." ]; then
              mv "$item" .
            fi
          done

          rmdir 02-OfflineAppTemplate

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Mover projeto para a raiz"
          git push
