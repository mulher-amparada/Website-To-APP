<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>Apps</title>


<style>

/* =========================================================
   RESET
========================================================= */



* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    font-family: Quicksand, sans-serif;

    user-select: none;

    -webkit-user-select: none;

    -webkit-tap-highlight-color: transparent;
}


html,
body {

    width: 100%;

    height: 100%;

    overflow: hidden;

    color: white;

    background: black;
}


/* =========================================================
   FONTE
========================================================= */

@font-face {

    font-family: Quicksand;

    src:
        url("font.ttf")
        format("truetype");

    font-display: swap;
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {

    width: 5px;
    height: 5px;
}

::-webkit-scrollbar-track {

    background: transparent;
}

::-webkit-scrollbar-thumb {

    background: rgba(255,255,255,.12);

    border-radius: 999px;
}


/* =========================================================
   FUNDO
========================================================= */

.fundo {

    position: fixed;

    inset: 0;

    z-index: -10;

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(255,150,150,.12),
            transparent 35%
        ),

        radial-gradient(
            circle at 100% 100%,
            rgba(255,255,255,.025),
            transparent 40%
        ),

        #000;
}


/* =========================================================
   APP
========================================================= */

@keyframes pageIn {
        from {
        opacity: 0;
        
    }

    to {
        opacity: 1;
        
    }
}


main {

    width: 100%;

    height: 100vh;

    padding:

        max(18px, env(safe-area-inset-top))

        max(16px, env(safe-area-inset-right))

        110px

        max(16px, env(safe-area-inset-left));
        
        animation:
        pageIn .6s ease both;
}


/* =========================================================
   TOPO
========================================================= */

.top {

    width: 100%;

    height: 55px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;
}


.title-area {

    min-width: 0;
}


.title {

    font-size: 22px;

    font-weight: 700;

    line-height: 1;
}


.subtitle {

    margin-top: 5px;

    font-size: 11px;

    color: rgba(255,255,255,.42);

    font-weight: 500;
}


/* =========================================================
   AÇÕES
========================================================= */

.actions {

    display: flex;

    align-items: center;

    gap: 7px;
}


.action {

    width: 42px;

    height: 42px;

    border: 0;

    outline: none;

    border-radius: 14px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: white;

    background:

        rgba(255,255,255,.055);

    border:

        1px solid rgba(255,255,255,.07);

    font-size: 19px;

    cursor: pointer;

    transition:

        transform .18s ease,

        background .18s ease,

        opacity .18s ease;
}


.action:active {

    transform: scale(.90);
}


.action:hover {

    background:

        rgba(255,255,255,.10);
}


#atualizar.loading {

    animation:
        girar .8s linear infinite;
}


/* =========================================================
   GRID
========================================================= */

.grid {

    width: 100%;

    height: calc(100vh - 165px);

    margin-top: 10px;

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 26px 10px;

    overflow-y: auto;

    overflow-x: hidden;

    padding:

        8px 3px

        30px;

    overscroll-behavior-y: contain;

    scrollbar-width: thin;
}


/* =========================================================
   APP
========================================================= */

.app {

    min-width: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-start;

    text-align: center;

    cursor: pointer;

    contain: layout paint;

    transition:

        transform .15s ease,

        opacity .15s ease;
        padding-bottom: 18%;
}


.app:active {

    transform: scale(.91);

    opacity: .65;
}


/* =========================================================
   ÍCONE
========================================================= */

.icon {

    width: 68px;

    height: 68px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 18px;

    overflow: hidden;
}


.icon img {

    width: 67px;

    height: 67px;

    display: block;

    object-fit: contain;

    border-radius: 17px;
}


/* =========================================================
   NOME
========================================================= */

.name {

    width: 100%;

    max-width: 82px;

    margin-top: 8px;

    font-size: 12px;

    line-height: 1.25;

    font-weight: 600;

    color: rgba(255,255,255,.88);

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* =========================================================
   SEM RESULTADOS
========================================================= */

.empty {

    grid-column: 1 / -1;

    min-height: 250px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    gap: 8px;

    color: rgba(255,255,255,.4);

    text-align: center;
}


.empty-icon {

    font-size: 34px;

    opacity: .5;
}


.empty-title {

    color: rgba(255,255,255,.75);

    font-size: 14px;

    font-weight: 600;
}


.empty-text {

    font-size: 11px;
}


/* =========================================================
   BARRA DE PESQUISA
========================================================= */

.search {

    position: fixed;

    left: 50%;

    bottom:
        max(20px, env(safe-area-inset-bottom));

    transform: translateX(-50%);

    z-index: 1000;

    width: min(68%, 430px);

    height: 56px;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 0 18px;

    border-radius: 999px;

    background:

        rgba(255,145,145,.88);

    box-shadow:

        0 15px 45px rgba(0,0,0,.35);

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    transition:

        width .25s ease,

        background .25s ease;
}


.search:focus-within {

    width: min(74%, 470px);

    background:

        rgba(255,155,155,.96);
}


.search-icon {

    width: 22px;

    height: 22px;

    flex-shrink: 0;

    opacity: .75;
}


.search input {

    width: 100%;

    min-width: 0;

    height: 100%;

    border: 0;

    outline: none;

    background: transparent;

    color: white;

    font-size: 15px;

    font-weight: 600;

    font-family: Quicksand, sans-serif;
}


.search input::placeholder {

    color: rgba(255,255,255,.75);
}


/* =========================================================
   INDICADOR DE ATUALIZAÇÃO
========================================================= */

.update-status {

    position: fixed;

    top:
        max(80px, calc(65px + env(safe-area-inset-top)));

    left: 50%;

    z-index: 2000;

    transform:
        translate(-50%, -15px);

    opacity: 0;

    pointer-events: none;

    padding: 8px 14px;

    border-radius: 999px;

    background:

        rgba(20,20,20,.88);

    border:

        1px solid rgba(255,255,255,.08);

    color:

        rgba(255,255,255,.75);

    font-size: 10px;

    transition:

        opacity .2s ease,

        transform .2s ease;
}


.update-status.show {

    opacity: 1;

    transform:
        translate(-50%, 0);
}


/* =========================================================
   PULL TO REFRESH
========================================================= */

.pull-indicator {

    position: fixed;

    top: 5px;

    left: 50%;

    z-index: 3000;

    width: 34px;

    height: 34px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background: rgba(25,25,25,.9);

    opacity: 0;

    transform:
        translate(-50%, -45px);

    transition:

        opacity .15s ease,

        transform .15s ease;
}


.pull-indicator.visible {

    opacity: 1;

    transform:
        translate(-50%, 0);
}


.pull-indicator.refresh {

    animation:
        girar .7s linear infinite;
}


/* =========================================================
   ANIMAÇÕES
========================================================= */

@keyframes girar {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   RESPONSIVO
========================================================= */

@media (max-width: 360px) {

    main {

        padding-left: 12px;

        padding-right: 12px;
    }


    .grid {

        gap: 22px 6px;
    }


    .icon,
    .icon img {

        width: 60px;

        height: 60px;
    }


    .name {

        max-width: 70px;

        font-size: 11px;
    }


    .title {

        font-size: 20px;
    }


    .search {

        width: 76%;
    }

}


@media (orientation: landscape) {

    .grid {

        grid-template-columns:
            repeat(6, minmax(0, 1fr));

        gap: 22px 8px;
    }


    .search {

        width: 32%;
    }

}

svg {
width: 25px;
height: 25px;
}
</style>

</head>

            </button>


        </div>

    </div>


    <!-- =====================================================

    <div

</main>

<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const CACHE_KEY =
    "apps_cache_v2";

const CACHE_TIME_KEY =
    "apps_cache_time_v2";


const CACHE_MAX_AGE =
    1000 * 60 * 60 * 24 * 7;


/* =========================================================
   ELEMENTOS
========================================================= */

const grid =
    document.getElementById("grid");

const pesquisa =
    document.getElementById("pesquisaInput");

const atualizar =
    document.getElementById("atualizar");

const contador =
    document.getElementById("contador");

const updateStatus =
    document.getElementById("updateStatus");

const pullIndicator =
    document.getElementById("pullIndicator");


/* =========================================================
   ESTADO
========================================================= */

let apps = [];

let appsFiltrados = [];

let atualizando = false;

let renderTimer = null;


/* =========================================================
   CACHE
========================================================= */

function carregarCache() {

    try {

        const salvo =
            localStorage.getItem(
                CACHE_KEY
            );

        if (!salvo) {

            return false;

        }


        const dados =
            JSON.parse(salvo);


        if (
            !Array.isArray(dados) ||
            dados.length === 0
        ) {

            return false;

        }


        apps = normalizarApps(dados);

        return apps.length > 0;

    } catch (erro) {

        return false;

    }

}


/* =========================================================
   SALVAR CACHE
========================================================= */

function salvarCache(lista) {

    try {

        localStorage.setItem(
            CACHE_KEY,
            JSON.stringify(lista)
        );

        localStorage.setItem(
            CACHE_TIME_KEY,
            String(Date.now())
        );

    } catch (erro) {

        /*
         * Se o cache estiver cheio ou indisponível,
         * a aplicação continua funcionando normalmente.
         */

    }

}


/* =========================================================
   CACHE ESTÁ FRESCO?
========================================================= */

function cacheEstaAtualizado() {

    try {

        const tempo =
            Number(
                localStorage.getItem(
                    CACHE_TIME_KEY
                )
            );


        if (!tempo) {

            return false;

        }


        return (
            Date.now() - tempo <
            CACHE_MAX_AGE
        );

    } catch (erro) {

        return false;

    }

}


/* =========================================================
   NORMALIZAR APPS
========================================================= */

function normalizarApps(lista) {

    if (!Array.isArray(lista)) {

        return [];

    }


    return lista
        .filter(app =>
            app &&
            app.nome &&
            app.pacote
        )
        .map(app => ({

            nome:
                String(app.nome),

            pacote:
                String(app.pacote),

            icone:
                app.icone
                    ? String(app.icone)
                    : ""

        }))
        .sort((a, b) =>
            a.nome.localeCompare(
                b.nome,
                "pt-BR",
                {
                    sensitivity: "base"
                }
            )
        );

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHTML(texto) {

    return String(texto)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================================
   RENDERIZAÇÃO
========================================================= */

function renderizar(lista) {

    appsFiltrados = lista;


    cancelAnimationFrame(
        renderTimer
    );


    renderTimer =
        requestAnimationFrame(() => {

            grid.innerHTML = "";


            if (!lista.length) {

                grid.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            ⌕
                        </div>

                        <div class="empty-title">
                            Nenhum aplicativo encontrado
                        </div>

                        <div class="empty-text">
                            Tente pesquisar outro nome
                        </div>

                    </div>

                `;

                return;

            }


            const fragment =
                document.createDocumentFragment();


            lista.forEach(app => {


                const div =
                    document.createElement("div");


                div.className =
                    "app";


                div.dataset.package =
                    app.pacote;


                const icon =
                    document.createElement("div");


                icon.className =
                    "icon";


                const img =
                    document.createElement("img");


                img.loading =
                    "lazy";


                img.decoding =
                    "async";


                img.alt =
                    "";


                /*
                 * O nome não é usado como src.
                 * Isso evita problemas com URLs contendo caracteres especiais.
                 */

                if (app.icone) {

                    img.src =
                        app.icone;

                }


                img.onerror =
                    () => {

                        img.style.display =
                            "none";

                    };


                icon.appendChild(img);


                const name =
                    document.createElement("div");


                name.className =
                    "name";


                name.textContent =
                    app.nome;


                div.appendChild(icon);

                div.appendChild(name);


                div.addEventListener(
                    "click",
                    () => {

                        abrirApp(
                            app.pacote
                        );

                    },
                    {
                        passive: true
                    }
                );


                fragment.appendChild(div);

            });


            grid.appendChild(
                fragment
            );

        });


    atualizarContador(
        lista.length
    );

}


/* =========================================================
   CONTADOR
========================================================= */

function atualizarContador(
    quantidade
) {

    if (!apps.length) {

        contador.textContent =
            "Nenhum aplicativo";

        return;

    }


    if (
        pesquisa.value.trim()
    ) {

        contador.textContent =
            `${quantidade} encontrado${quantidade === 1 ? "" : "s"}`;

    } else {

        contador.textContent =
            `${quantidade} aplicativo${quantidade === 1 ? "" : "s"}`;

    }

}


/* =========================================================
   ABRIR APP
========================================================= */

function abrirApp(
    pacote
) {

    try {

        if (
            typeof Android !== "undefined" &&
            typeof Android.abrirApp === "function"
        ) {

            Android.abrirApp(
                pacote
            );

        }

    } catch (erro) {

        console.error(
            "Erro ao abrir app:",
            erro
        );

    }

}


/* =========================================================
   PESQUISA
========================================================= */

function pesquisar() {

    const termo =
        pesquisa.value
            .toLocaleLowerCase(
                "pt-BR"
            )
            .trim();


    if (!termo) {

        renderizar(
            apps
        );

        return;

    }


    const resultado =
        apps.filter(app =>
            app.nome
                .toLocaleLowerCase(
                    "pt-BR"
                )
                .includes(termo)
        );


    renderizar(
        resultado
    );

}


pesquisa.addEventListener(
    "input",
    pesquisar
);


/* =========================================================
   ATUALIZAR DADOS DO ANDROID
========================================================= */

async function atualizarApps(
    mostrarMensagem = true
) {

    if (atualizando) {

        return;

    }


    if (
        typeof Android === "undefined" ||
        typeof Android.obterApps !== "function"
    ) {

        if (!apps.length) {

            mostrarVazio();

        }

        return;

    }


    atualizando = true;


    atualizar.classList.add(
        "loading"
    );


    if (mostrarMensagem) {

        mostrarStatus(
            "Atualizando aplicativos..."
        );

    }


    try {

        /*
         * A chamada pesada acontece SOMENTE aqui.
         *
         * Ao abrir a tela, o cache é usado.
         */

        const resposta =
            await Promise.resolve(
                Android.obterApps()
            );


        if (!resposta) {

            throw new Error(
                "Resposta vazia"
            );

        }


        const dados =
            typeof resposta === "string"
                ? JSON.parse(resposta)
                : resposta;


        const novosApps =
            normalizarApps(
                dados
            );


        if (!novosApps.length) {

            throw new Error(
                "Nenhum aplicativo retornado"
            );

        }


        apps =
            novosApps;


        salvarCache(
            apps
        );


        /*
         * Mantém a pesquisa atual.
         */

        pesquisar();


        mostrarStatus(
            `${apps.length} aplicativos atualizados`
        );


    } catch (erro) {

        console.error(
            "Erro ao atualizar apps:",
            erro
        );


        /*
         * Se já temos cache,
         * não apaga os aplicativos.
         */

        if (apps.length) {

            mostrarStatus(
                "Usando dados salvos"
            );

        } else {

            mostrarStatus(
                "Não foi possível carregar os aplicativos"
            );

            mostrarVazio();

        }

    } finally {

        atualizando = false;


        atualizar.classList.remove(
            "loading"
        );


        setTimeout(
            () => {

                esconderStatus();

            },
            1800
        );

    }

}


/* =========================================================
   STATUS
========================================================= */

function mostrarStatus(
    texto
) {

    updateStatus.textContent =
        texto;

    updateStatus.classList.add(
        "show"
    );

}


function esconderStatus() {

    updateStatus.classList.remove(
        "show"
    );

}


/* =========================================================
   ESTADO VAZIO
========================================================= */

function mostrarVazio() {

    grid.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                ◌
            </div>

            <div class="empty-title">
                Nenhum aplicativo carregado
            </div>

            <div class="empty-text">
                Toque em atualizar para tentar novamente
            </div>

        </div>

    `;

    contador.textContent =
        "Nenhum aplicativo";

}


/* =========================================================
   BOTÃO ATUALIZAR
========================================================= */

atualizar.addEventListener(
    "click",
    () => {

        atualizarApps(
            true
        );

    }
);


/* =========================================================
   PULL TO REFRESH
========================================================= */

let inicioY = 0;

let puxando = false;


grid.addEventListener(
    "touchstart",
    event => {

        if (
            grid.scrollTop > 0
        ) {

            return;

        }


        inicioY =
            event.touches[0].clientY;

        puxando = true;

    },
    {
        passive: true
    }
);


grid.addEventListener(
    "touchmove",
    event => {

        if (!puxando) {

            return;

        }


        const atualY =
            event.touches[0].clientY;


        const distancia =
            atualY - inicioY;


        if (
            distancia <= 0
        ) {

            return;

        }


        if (
            distancia > 25
        ) {

            pullIndicator.classList.add(
                "visible"
            );

        }

    },
    {
        passive: true
    }
);


grid.addEventListener(
    "touchend",
    () => {

        if (!puxando) {

            return;

        }


        puxando = false;


        if (
            pullIndicator.classList.contains(
                "visible"
            )
        ) {

            pullIndicator.classList.add(
                "refresh"
            );


            atualizarApps(
                true
            ).finally(() => {

                pullIndicator.classList.remove(
                    "visible",
                    "refresh"
                );

            });

        }

    },
    {
        passive: true
    }
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

/* =========================================================
   INICIALIZAÇÃO
========================================================= */

function iniciar() {

    /*
     * Ao abrir:
     * SOMENTE carrega os dados salvos.
     *
     * NÃO consulta o Android.
     * NÃO atualiza em segundo plano.
     * NÃO faz atualização automática.
     */

    const possuiCache =
        carregarCache();


    if (possuiCache) {

        renderizar(
            apps
        );

        return;

    }


    /*
     * Sem cache:
     * não busca automaticamente.
     *
     * O usuário precisa tocar
     * no botão ↻ para carregar.
     */

    mostrarVazio();

}


/* =========================================================
   INICIAR
========================================================= */

if (
    document.readyState === "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        iniciar,
        {
            once: true
        }
    );

} else {

    iniciar();

}

</script>
