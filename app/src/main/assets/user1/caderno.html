<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#09090d"
>

<title>Diário</title>


<style>

/* =========================================================
   FONTE
========================================================= */

@font-face {
    font-family: "Quicksand";
    src: url("font.ttf") format("truetype");
    font-display: swap;
}


/* =========================================================
   VARIÁVEIS
========================================================= */

:root {

    --accent: #ff8eaf;
    --accent-light: #ffc1d2;
    --accent-dark: #e96d92;

    --background: #08090d;

    --surface: rgba(255,255,255,.055);
    --surface-strong: rgba(255,255,255,.08);

    --border: rgba(255,255,255,.10);
    --border-light: rgba(255,255,255,.16);

    --text: #fff;
    --muted: rgba(255,255,255,.48);

    --page: #ffc0d0;
    --page-text: #292127;
}


/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

    font-family: "Quicksand", sans-serif;

    -webkit-tap-highlight-color: transparent;
}


html {

    width: 100%;
    min-height: 100%;

    scroll-behavior: auto;
}


body {

    width: 100%;
    min-height: 100vh;

    color: var(--text);

    overflow-x: hidden;

    background: #000;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding:
        max(10px, env(safe-area-inset-top))
        0
        max(14px, env(safe-area-inset-bottom));

    position: relative;
}


/* =========================================================
   ANIMAÇÕES LEVES
========================================================= */

@keyframes pageIn {

    from {
        opacity: 0;
        transform: translateY(0px);
    }

    to {
        opacity: 1;
        transform: translateY(18px);
    }
}


@keyframes floatIn {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   TOPO
========================================================= */

.topo {

    position: relative;

    width: min(92%, 900px);

    min-height: 66px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 14px;

    padding:
        9px
        10px
        9px
        17px;

    border: 1px solid var(--border);

    border-radius: 999px;

    background: #111;

    box-shadow:
        0 10px 28px rgba(0,0,0,.28);

    animation:
        pageIn .35s ease both;

    z-index: 10;
}


/* =========================================================
   IDENTIDADE
========================================================= */

.diario-brand {

    display: flex;
    align-items: center;

    gap: 11px;

    min-width: 0;
}


.diario-icon {

    width: 42px;
    height: 42px;

    flex: 0 0 42px;

    display: grid;
    place-items: center;

    border-radius: 14px;

    color: #fff;

    background: #000;

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 5px 14px rgba(0,0,0,.3);

    font-size: 19px;
}


.diario-info {

    min-width: 0;

}


.diario-title {

    font-size: 17px;

    font-weight: 700;

    letter-spacing: -.3px;

    line-height: 1.1;
}


.diario-subtitle {

    margin-top: 3px;

    color: var(--muted);

    font-size: 9px;

    line-height: 1;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   BOTÃO TOPO
========================================================= */

.voltar {

    width: 42px;
    height: 42px;

    flex: 0 0 42px;

    display: grid;
    place-items: center;

    border:
        1px solid
        var(--border);

    border-radius: 14px;

    background:
        rgba(255,255,255,.045);

    cursor: pointer;

    transition:
        transform .15s ease,
        background .15s ease;

    z-index: 2;
}


.voltar:active {

    transform: scale(.92);

    background:
        rgba(255,255,255,.09);
}


.voltar img {

    width: 20px;
    height: 20px;

    object-fit: contain;

    opacity: .8;
}


/* =========================================================
   ÁREA DO LIVRO
========================================================= */

.book-wrapper {

    position: relative;
    
        z-index: 9999999999;

    width: min(92%, 900px);

    margin-top: 15%;

    animation:
        floatIn .4s .05s ease both;
}


/* =========================================================
   INDICADOR
========================================================= */

.page-indicator {

    position: absolute;

    top: -11px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 50;

    display: flex;
    align-items: center;

    gap: 6px;

    padding: 5px 10px;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius: 999px;

    color:
        rgba(255,255,255,.62);

    background:
        #111;

    box-shadow:
        0 5px 14px
        rgba(0,0,0,.25);

    font-size: 9px;

    pointer-events: none;
}


.page-dot {

    width: 5px;
    height: 5px;

    flex: 0 0 5px;

    border-radius: 50%;

    background:
        var(--accent);

    box-shadow:
        0 0 6px
        rgba(255,142,175,.65);
}


/* =========================================================
   LIVRO
========================================================= */

.book {

    position: relative;

    width: 100%;

    height: min(76vh, 700px);

    min-height: 430px;

margin-top: 10%;

    perspective: 1400px;

    transform-style: preserve-3d;

    border-radius: 28px;

    background: #101014;

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 18px 42px
        rgba(0,0,0,.42);

    overflow: visible;
}


/* =========================================================
   CAMADAS DA CAPA
========================================================= */

.book::before {

    content: "";

    position: absolute;

    left: -5px;
    top: 6px;

    width: 100%;
    height: 100%;

    border-radius: 28px;

    background: #151519;

    border:
        1px solid
        rgba(255,255,255,.045);

    z-index: -2;
}


.book::after {

    content: "";

    position: absolute;

    left: 4px;
    top: 11px;

    width: 100%;
    height: 100%;

    border-radius: 28px;

    background: #0c0c10;

    z-index: -3;
}


/* =========================================================
   PÁGINA
========================================================= */

.page {

    position: absolute;

    inset: 0;

    transform-style: preserve-3d;

    transform-origin: left center;

    transition:
        transform .58s
        cubic-bezier(.22,.7,.2,1);

    border-radius: 27px;

    will-change: transform;
}


/* =========================================================
   FACES
========================================================= */

.face {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    padding: 34px 31px;

    border-radius: inherit;

    overflow: hidden;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}


/* =========================================================
   FRENTE DA FOLHA
========================================================= */

.front {

    color: var(--page-text);

    background: var(--page);

    box-shadow:
        inset 0 0 35px
        rgba(130,70,90,.07),

        8px 12px 30px
        rgba(0,0,0,.16);
}


/* =========================================================
   VERSO
========================================================= */

.back {

    color: #fff;

    background:
        linear-gradient(
            135deg,
            #e86f95,
            #b94870
        );

    transform: rotateY(180deg);

    box-shadow: none;
}


/* =========================================================
   TEXTAREA
========================================================= */

textarea {

    position: relative;

    z-index: 2;

    display: block;

    width: 100%;
    height: 100%;

    padding: 3px;

    border: 0;
    outline: 0;

    resize: none;

    background: transparent;

    color: var(--page-text);

    font-size: 16px;

    font-weight: 500;

    line-height: 1.9;

    letter-spacing: .1px;

    caret-color:
        var(--accent-dark);

    -webkit-appearance: none;
}


textarea::placeholder {

    color:
        rgba(60,35,45,.35);
}


/* =========================================================
   PÁGINA VIRADA
========================================================= */

.page.virada {

    transform:
        rotateY(-180deg);
}


/* =========================================================
   CONTROLES
========================================================= */

.controls {

    width: min(92%, 900px);

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 7px;

    margin-top: 13px;

    padding: 7px;

    border:
        1px solid
        var(--border);

    border-radius: 18px;

    background: #101014;

    box-shadow:
        0 7px 20px
        rgba(0,0,0,.25);

    animation:
        floatIn .4s .1s ease both;
}


/* =========================================================
   BOTÕES
========================================================= */

.control-button {

    width: 45px;
    height: 39px;

    display: grid;
    place-items: center;

    border:
        1px solid
        var(--border);

    border-radius: 12px;

    color:
        rgba(255,255,255,.72);

    background:
        rgba(255,255,255,.035);

    cursor: pointer;

    transition:
        transform .12s ease,
        background .12s ease;
}


.control-button:active {

    transform: scale(.91);

    background:
        rgba(255,255,255,.09);
}


.control-button.danger:active {

    color: #ff7182;

    background:
        rgba(255,113,130,.08);
}


.control-spacer {

    flex: 1;
}


.hint {

    color:
        rgba(255,255,255,.28);

    font-size: 9px;

    text-align: center;

    white-space: nowrap;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    body {

        padding-top:
            max(8px, env(safe-area-inset-top));
    }


    .topo {

        width:
            calc(100% - 22px);

        min-height: 61px;

        padding:
            8px
            8px
            8px
            13px;

        border-radius: 999px;
    }


    .diario-icon {

        width: 37px;
        height: 37px;

        flex-basis: 37px;

        border-radius: 120px;

        font-size: 16px;
    }


    .diario-title {

        font-size: 15px;
    }


    .diario-subtitle {

        font-size: 8px;
    }


    .voltar {

        width: 37px;
        height: 37px;

        flex-basis: 37px;

        border-radius: 102px;
    }


    .book-wrapper {

    z-index: 9999999999;
        width:
            calc(100% - 22px);

        margin-top: 15%;
    }


    .book {

        height:
            calc(100vh - 178px);

        min-height: 450px;

        max-height: 720px;

        border-radius: 23px;
        margin-top: 10%;
    }


    .book::before,
    .book::after {

        border-radius: 23px;
    }


    .page,
    .face {

        border-radius: 22px;
    }


    .face {

        padding:
            29px 21px;
    }


    textarea {

        padding: 2px;

        font-size: 15px;

        line-height: 1.88;
    }


    .controls {

        width:
            calc(100% - 22px);

        margin-top: 11px;

        border-radius: 17px;
    }


    .hint {

        display: none;
    }


    .control-button {

        width: 43px;
        height: 37px;
    }
}


/* =========================================================
   TELAS PEQUENAS
========================================================= */

@media (max-width: 360px) {

    .book {

        min-height: 410px;
        
        margin-top: 10%;
    }


    .face {

        padding:
            26px 17px;
    }


    textarea {

        font-size: 14px;

        line-height: 1.85;
    }
}


/* =========================================================
   LANDSCAPE
========================================================= */

@media (
    orientation: landscape
) and (
    max-height: 600px
) {

    .topo {

        min-height: 56px;
    }


    .book {

        height:
            calc(100vh - 128px);

margin-top: 10%;

        min-height: 280px;
    }


    .controls {

        margin-top: 8px;
    }
}


/* =========================================================
   REDUÇÃO DE MOVIMENTO
========================================================= */

@media (
    prefers-reduced-motion: reduce
) {

    *,
    *::before,
    *::after {

        animation: none !important;

        transition: none !important;
    }
}

</style>

</head>


<body>


<!-- =======================================================
     TOPO
======================================================= -->

<header class="topo">


    <div class="diario-brand">

        <div class="diario-icon">
            ✦
        </div>


        <div class="diario-info">

            <div class="diario-title">
                Meu Diário
            </div>

            <div class="diario-subtitle">
                Suas idéias estão seguras
            </div>

        </div>

    </div>


    <button
        class="voltar"
        onclick="limparTudo()"
        aria-label="Apagar diário"
    >

        <img
            src="14.svg"
            alt=""
        >

    </button>

</header>


<!-- =======================================================
     LIVRO
======================================================= -->

<div class="book-wrapper">


    <div class="page-indicator">

        <span class="page-dot"></span>

        Página
        <span id="pageNumber">1</span>

    </div>


    <div
        class="book"
        id="book"
    ></div>

</div>


<!-- =======================================================
     CONTROLES
======================================================= -->



<script>

/* =========================================================
   ESTADO
========================================================= */

let dados = [];

let paginas = [];

let atual = 0;

let startX = 0;

let movendo = false;

let arrastandoPagina = false;


/* =========================================================
   ELEMENTOS
========================================================= */

const book =
    document.getElementById(
        "book"
    );


const pageNumber =
    document.getElementById(
        "pageNumber"
    );


/* =========================================================
   CARREGAR DIÁRIO
========================================================= */

try {

    if (
        typeof Cripto !== "undefined" &&
        typeof Cripto.carregar === "function"
    ) {

        const salvo =
            Cripto.carregar(
                "diario"
            );


        if (salvo) {

            if (
                typeof salvo === "string"
            ) {

                try {

                    const parsed =
                        JSON.parse(salvo);


                    if (
                        Array.isArray(parsed)
                    ) {

                        dados =
                            parsed;

                    }

                } catch (error) {

                    dados = [];

                }

            } else if (
                Array.isArray(salvo)
            ) {

                dados =
                    salvo;

            }

        }

    }

} catch (error) {

    console.error(
        "Erro ao carregar diário:",
        error
    );

    dados = [];

}


/* =========================================================
   SALVAR
========================================================= */

function salvar() {

    try {

        if (
            typeof Cripto !== "undefined" &&
            typeof Cripto.salvar === "function"
        ) {

            Cripto.salvar(
                "diario",
                JSON.stringify(
                    dados
                )
            );

        }

    } catch (error) {

        console.error(
            "Erro ao salvar diário:",
            error
        );

    }

}


/* =========================================================
   ATUALIZAR INDICADOR
========================================================= */

function atualizarIndicador() {

    pageNumber.textContent =
        atual + 1;

}


/* =========================================================
   CRIAR PÁGINA
========================================================= */

function criarPagina(
    index
) {

    const page =
        document.createElement(
            "div"
        );


    page.className =
        "page";


    page.style.zIndex =
        100 - index;


    const front =
        document.createElement(
            "div"
        );


    front.className =
        "face front";


    const back =
        document.createElement(
            "div"
        );


    back.className =
        "face back";


    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value =
        typeof dados[index] === "string"
            ? dados[index]
            : "";


    textarea.placeholder =
        "Comece a escrever aqui...";


    textarea.setAttribute(
        "spellcheck",
        "true"
    );


    textarea.addEventListener(
        "input",
        () => {

            dados[index] =
                textarea.value;

            salvar();


            /*
             * Cria automaticamente
             * a próxima página.
             */

            if (
                textarea.value.length > 220 &&
                index === atual
            ) {

                virarProxima();

            }

        }
    );


    front.appendChild(
        textarea
    );


    page.appendChild(
        front
    );

    page.appendChild(
        back
    );


    book.appendChild(
        page
    );


    paginas[index] =
        page;


    /*
     * Só focar automaticamente
     * na página atual.
     */

    if (
        index === atual
    ) {

        setTimeout(
            () => {

                textarea.focus();

            },
            150
        );

    }


    atualizarIndicador();

}


/* =========================================================
   INICIAR
========================================================= */

criarPagina(0);


/* =========================================================
   PRÓXIMA PÁGINA
========================================================= */

function virarProxima() {

    const pagina =
        paginas[atual];


    if (!pagina) {

        return;

    }


    pagina.classList.add(
        "virada"
    );


    atual++;


    if (
        !paginas[atual]
    ) {

        criarPagina(
            atual
        );

    }


    atualizarIndicador();


    focarPaginaAtual();

}


/* =========================================================
   VOLTAR
========================================================= */

function voltarPagina() {

    if (
        atual <= 0
    ) {

        return;

    }


    atual--;


    const pagina =
        paginas[atual];


    if (pagina) {

        pagina.classList.remove(
            "virada"
        );

    }


    atualizarIndicador();


    focarPaginaAtual();

}


/* =========================================================
   FOCO
========================================================= */

function focarPaginaAtual() {

    setTimeout(
        () => {

            const pagina =
                paginas[atual];


            if (!pagina) {

                return;

            }


            const textarea =
                pagina.querySelector(
                    "textarea"
                );


            if (textarea) {

                textarea.focus();

            }

        },
        350
    );

}


/* =========================================================
   LIMPAR
========================================================= */

function limparTudo() {

    const confirmar =
        confirm(
            "Apagar todas as páginas do diário?"
        );


    if (!confirmar) {

        return;

    }


    try {

        if (
            typeof Cripto !== "undefined" &&
            typeof Cripto.remover === "function"
        ) {

            Cripto.remover(
                "diario"
            );

        }

    } catch (error) {

        console.error(
            "Erro ao limpar:",
            error
        );

    }


    location.reload();

}


/* =========================================================
   TOUCH
========================================================= */

book.addEventListener(
    "touchstart",
    event => {

        if (
            event.touches.length !== 1
        ) {

            return;

        }


        startX =
            event.touches[0].clientX;

        movendo =
            true;

        arrastandoPagina =
            false;

    },
    {
        passive: true
    }
);


book.addEventListener(
    "touchmove",
    event => {

        if (
            !movendo ||
            event.touches.length !== 1
        ) {

            return;

        }


        const atualX =
            event.touches[0].clientX;


        const diff =
            atualX - startX;


        /*
         * Só considera arraste
         * horizontal.
         */

        if (
            Math.abs(diff) < 8
        ) {

            return;

        }


        arrastandoPagina =
            true;


        const pagina =
            paginas[atual];


        if (!pagina) {

            return;

        }


        /*
         * Não permite arrastar
         * para a direita na primeira
         * página.
         */

        if (
            atual === 0 &&
            diff > 0
        ) {

            return;

        }


        /*
         * Arraste suave.
         */

        let rot =
            diff / 1.8;


        rot =
            Math.max(
                Math.min(
                    rot,
                    0
                ),
                -180
            );


        pagina.style.transform =
            `rotateY(${rot}deg)`;

    },
    {
        passive: true
    }
);


book.addEventListener(
    "touchend",
    event => {

        if (!movendo) {

            return;

        }


        movendo =
            false;


        const endX =
            event.changedTouches[0].clientX;


        const diff =
            endX - startX;


        const pagina =
            paginas[atual];


        if (pagina) {

            pagina.style.transform =
                "";

        }


        if (
            !arrastandoPagina
        ) {

            return;

        }


        if (
            diff < -55
        ) {

            virarProxima();

        } else if (
            diff > 55
        ) {

            voltarPagina();

        }

    },
    {
        passive: true
    }
);


/* =========================================================
   TECLADO
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        /*
         * Não interferir enquanto
         * o usuário estiver usando
         * atalhos do sistema.
         */

        if (
            event.key === "ArrowRight"
        ) {

            virarProxima();

        }


        if (
            event.key === "ArrowLeft"
        ) {

            voltarPagina();

        }

    }
);

</script>


<script>

/* =========================================================
   WALLPAPER ANDROID
========================================================= */

window.addEventListener(
    "load",
    () => {

        let wall = "";


        try {

            if (
                typeof Android !== "undefined" &&
                typeof Android.getWallpaperUrl ===
                    "function"
            ) {

                wall =
                    Android.getWallpaperUrl();

            }

        } catch (error) {

            wall = "";

        }


        if (
            wall &&
            typeof wall === "string"
        ) {

            document.body.style.backgroundImage =
                `url("${wall.replace(
                    /"/g,
                    '\\"'
                )}")`;

            document.body.style.backgroundSize =
                "cover";

            document.body.style.backgroundPosition =
                "center";

            document.body.style.backgroundRepeat =
                "no-repeat";

            document.body.style.backgroundAttachment =
                "fixed";

        }

    }
);

</script>


</body>

</html>
