<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Controle</title>

<style>

/* =========================================================
   FONTE
========================================================= */

@font-face {
    font-family: "Quicksand";
    src: url("font.ttf") format("truetype");
    font-weight: 400 800;
}


/* =========================================================
   VARIÁVEIS
========================================================= */

:root {

    --bg: #000;

    --surface: #101218;
    --surface-2: #151720;
    --surface-3: #1b1e28;

    --white: #fff;
    --text: #f7f7fa;

    --soft: #969baa;
    --muted: #626877;

    --pink: #ff3f82;
    --pink-light: #ff6b9f;

    --red: #ff4054;
    --red-dark: #d9273d;

    --purple: #8b5cf6;
    --blue: #4f8cff;
    --green: #32d477;
    --orange: #ff9f43;
    --cyan: #27c9c1;

    --border: rgba(255,255,255,.075);
    --border-strong: rgba(255,255,255,.13);

    --radius: 24px;
    --radius-small: 17px;
}


/* =========================================================
   RESET
========================================================= */

* {

    box-sizing: border-box;

    margin: 0;
    padding: 0;

    font-family: "Quicksand", sans-serif;

    font-weight: 700;

    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100%;
    min-height: 100%;

    background: #000;

    color: var(--text);
}

body {

    min-height: 100vh;

    overflow-x: hidden;

    padding-top:
        env(safe-area-inset-top);

    padding-bottom:
        env(safe-area-inset-bottom);
}


/* =========================================================
   ANIMAÇÕES
========================================================= */

@keyframes pageIn {
        from {
        opacity: 0;
        
    }

    to {
        opacity: 1;
        
    }
}


@keyframes sosGlow {

    0%,
    100% {

        box-shadow:
            0 18px 50px rgba(255,64,84,.18),
            0 0 0 0 rgba(255,64,84,0);
    }

    50% {

        box-shadow:
            0 18px 55px rgba(255,64,84,.27),
            0 0 0 9px rgba(255,64,84,.035);
    }
}


@keyframes pulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }
}


@keyframes statusPulse {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: .45;
    }
}




/* =========================================================
   LAYOUT
========================================================= */

.mainUI {

    width: 100%;

    max-width: 680px;

    margin: 0 auto;

    padding:
        28px
        18px
        125px;

    display: flex;

    flex-direction: column;

    gap: 34px;

    animation:
        pageIn .5s ease;
}


/* =========================================================
   HEADER
========================================================= */

.hero {

    width: 100%;

    display: flex;

    flex-direction: column;
}


.heroTag {

    width: fit-content;

    display: flex;

    align-items: center;

    gap: 8px;

    padding:
        7px
        11px;

position: relative;
top: 5%;
    border-radius: 200px;

    color: #ff78a8;

    background:
        rgba(255,63,130,.08);

    border:
        1px solid rgba(255,63,130,.13);

    font-size: 11px;

    letter-spacing: 1.3px;

    text-transform: uppercase;
}


.heroTag::before {

    content: "";

    width: 6px;
    height: 6px;

    flex-shrink: 0;

    border-radius: 50%;

    background:
        var(--pink);

    box-shadow:
        0 0 10px rgba(255,63,130,.85);
}


/* =========================================================
   SEÇÕES
========================================================= */

.section {

    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 11px;

    animation:
        pageIn .5s ease both;
}


.label {

    display: flex;

    align-items: center;

    gap: 8px;

    padding-left: 3px;

    color: var(--muted);

    font-size: 10px;

    letter-spacing: 1.8px;

    text-transform: uppercase;
}


.label::before {

    content: "";

    width: 4px;
    height: 4px;

    flex-shrink: 0;

    border-radius: 50%;

    background:
        var(--pink);

    box-shadow:
        0 0 8px rgba(255,63,130,.5);
}


/* =========================================================
   SOS
========================================================= */

.panic {

    width: 100%;

    height: 300px;

    position: relative;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    border-radius: 30px;

    cursor: pointer;

    background:

        radial-gradient(
            circle at 50% 0%,
            rgba(255,255,255,.15),
            transparent 40%
        ),

        linear-gradient(
            145deg,
            #ff465a,
            #e92d43
        );

    border:
        1px solid rgba(255,255,255,.10);



    transition:
        transform .15s ease,
        filter .15s ease;
}


.panic::before {

    content: "";

    position: absolute;

    width: 370px;
    height: 370px;

    top: -245px;
    right: -135px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.075);

    pointer-events: none;
}


.panic span {

    position: relative;

    z-index: 2;

    color: white;

    font-size:
        clamp(62px,17vw,88px);

    line-height: .9;

    letter-spacing: 5px;

    text-shadow:
        0 5px 20px rgba(0,0,0,.17);
}


.panic small {

    position: relative;

    z-index: 2;

    margin-top: 17px;

    color:
        rgba(255,255,255,.78);

    font-size: 12px;

    letter-spacing: .5px;
}


.panic:active {

    transform:
        scale(.965);

    filter:
        brightness(1.08);
}


/* =========================================================
   PROTEÇÃO POR SOM
========================================================= */

.palma {

    width: 100%;

    padding: 24px;

    position: relative;

    overflow: hidden;

    border-radius:
        var(--radius);

    background:

        linear-gradient(
            145deg,
            #161820,
            #0f1117
        );

    border:
        1px solid var(--border);

    box-shadow:
        0 16px 40px rgba(0,0,0,.25);
}


.palma::before {

    content: "";

    position: absolute;

    width: 240px;
    height: 240px;

    top: -160px;
    right: -90px;

    border-radius: 50%;

    background:
        rgba(255,63,130,.065);

    pointer-events: none;
}




.palma h3 {

    color: white;

    font-size: 22px;

    line-height: 1.15;

    margin-bottom: 9px;
}


.palma p {

    max-width: 500px;

    margin-bottom: 21px;

    color: var(--soft);

    font-size: 13px;

    line-height: 1.65;
}


/* =========================================================
   BOTÕES
========================================================= */

.btn,
.local,
.palma button,
.local99,
.local999 {

    width: 100%;

    min-height: 56px;

    padding:
        14px
        17px;

    border: 0;

    border-radius: 160px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    font-family:
        "Quicksand",
        sans-serif;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    user-select: none;

    -webkit-user-select: none;

    touch-action: manipulation;

    transition:
        transform .14s ease,
        filter .14s ease,
        box-shadow .2s ease,
        background .2s ease;
}


.btn:active,
.local:active,
.palma button:active,
.local99:active,
.local999:active {

    transform:
        scale(.965);

    filter:
        brightness(1.08);
}


/* =========================================================
   EMERGÊNCIA
========================================================= */

.policia {

    background:
        linear-gradient(
            135deg,
            #4d8cff,
            #326ed8
        );

    box-shadow:
        0 9px 24px rgba(77,140,255,.12);
}


.samu {

    background:
        linear-gradient(
            135deg,
            #ffa94d,
            #df7d19
        );

    box-shadow:
        0 9px 24px rgba(255,169,77,.10);
}


.mulher {

    background:
        linear-gradient(
            135deg,
            #ff4e90,
            #dc2f6d
        );

    box-shadow:
        0 9px 24px rgba(255,78,144,.11);
}


.zap {

    background:
        linear-gradient(
            135deg,
            #35d477,
            #20af5b
        );

    box-shadow:
        0 9px 24px rgba(53,212,119,.10);
}


/* =========================================================
   PROTEÇÃO POR SOM
========================================================= */

#ativarPalmas {

    background:
        linear-gradient(
            135deg,
            var(--pink),
            #e52e70
        );

    box-shadow:
        0 9px 25px rgba(255,63,130,.15);
}


#desativarPalmas {

    margin-top: 9px;

    color: #8d93a1;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid var(--border);
}


/* =========================================================
   MOVIMENTO
========================================================= */

#protecao {

    width: 100%;

    min-height: 140px;

    padding: 25px;

    position: relative;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    border-radius:
        var(--radius);

    text-align: center;

    font-size: 14px;

    line-height: 1.55;

    cursor: pointer;

    transition:
        background .25s ease,
        border .25s ease,
        box-shadow .25s ease,
        color .25s ease,
        transform .15s ease;
}


#protecao:active {

    transform:
        scale(.98);
}


.desativado {

    color: #777d8b;

    background:

        linear-gradient(
            145deg,
            #11131a,
            #0d0f14
        );

    border:
        1px solid var(--border);
}


.ativo {

    color: #c9adff;

    background:

        linear-gradient(
            145deg,
            #211636,
            #151021
        );

    border:
        1px solid rgba(139,92,246,.42);

    box-shadow:
        0 15px 40px rgba(139,92,246,.12);
}


.ativo::after {

    content: "";

    position: absolute;

    width: 8px;
    height: 8px;

    top: 18px;
    right: 18px;

    border-radius: 50%;

    background:
        #a878ff;

    box-shadow:
        0 0 12px rgba(168,120,255,.8);

    animation:
        statusPulse 1.5s infinite;
}


/* =========================================================
   BRILHO
========================================================= */

.local99,
.local999 {

    min-height: 92px;

    border-radius:
        var(--radius-small);

    font-size: 14px;

    line-height: 1.5;

    text-align: center;
}


.local99 {

    color: #858c9b;

    background:

        linear-gradient(
            145deg,
            #11131a,
            #0d0f14
        );

    border:
        1px solid var(--border);
}


.local999 {

    position: relative;

    color:
        var(--orange);

    background:

        linear-gradient(
            145deg,
            #211b0e,
            #15120c
        );

    border:
        1px solid rgba(255,159,67,.38);

    box-shadow:
        0 12px 35px rgba(255,159,67,.07);
}


.local999::after {

    content: "";

    position: absolute;

    width: 8px;
    height: 8px;

    top: 18px;
    right: 18px;

    border-radius: 50%;

    background:
        var(--orange);

    box-shadow:
        0 0 12px rgba(255,159,67,.8);

    animation:
        statusPulse 1.5s infinite;
}


/* =========================================================
   LOCALIZAÇÃO
========================================================= */

.local {

    background:

        linear-gradient(
            135deg,
            #26c8c1,
            #14958f
        );

    box-shadow:
        0 9px 25px rgba(39,201,193,.10);
}


/* =========================================================
   CONTATOS
========================================================= */

.btn.contato {

    background:

        linear-gradient(
            135deg,
            #8b5cf6,
            #6f42d8
        );

    box-shadow:
        0 9px 25px rgba(139,92,246,.11);
}


.btn.sos-contatos {

    background:

        linear-gradient(
            135deg,
            #ed3d55,
            #bd253b
        );

    box-shadow:
        0 9px 25px rgba(237,61,85,.11);
}





/* =========================================================
   ACESSIBILIDADE
========================================================= */

button:focus-visible,
.panic:focus-visible,
#protecao:focus-visible {

    outline:
        2px solid
        rgba(255,63,130,.7);

    outline-offset: 3px;
}


::selection {

    color: white;

    background:
        rgba(255,63,130,.35);
}


/* =========================================================
   CELULARES
========================================================= */

@media (max-width: 420px) {

    .mainUI {

        padding:
            22px
            14px
            110px;

        gap: 30px;
    }


    .panic {

        height: 245px;

        border-radius: 26px;
    }


    .panic span {

        font-size: 60px;
    }


    .palma {

        padding: 21px;
    }



}


/* =========================================================
   TELAS MAIORES
========================================================= */

@media (min-width: 600px) {

    .mainUI {

        padding-left: 28px;

        padding-right: 28px;
    }
}

</style>

<style>
/* TOGGLE */
.toggle {
  width: 60%;
  height: 65px;
  background: #444;
  border-radius: 80px;
  padding: 5px;

  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);

  display: flex;
  align-items: center;
}

.alavanca {
  background: #222;
  width: 50%;
  height: 100%;
  border-radius: 80px;

  display: flex;
  justify-content: center;
  align-items: center;

  transition: transform 0.3s ease;
}

/* ícones */
svg {
  width: 28px;
  height: 28px;
}

.icon2 {
  display: none;
}
</style>

</head>





<body>




<!-- =======================================================
     INTERFACE
======================================================== -->

<main class="mainUI">


    <!-- ===================================================
         CABEÇALHO
    ==================================================== -->

    <header class="hero">

        <div class="heroTag">
            Mulher Amparada
        </div>

    </header>


    <!-- ===================================================
         EMERGÊNCIA
    ==================================================== -->

    <section class="section">

        <div class="label">
            Emergência
        </div>

        <button
            class="panic"
            id="panic"
            type="button"
            aria-label="Pedir ajuda"
        >

            <span>SOS</span>

            <small>
                toque para pedir ajuda
            </small>

        </button>

    </section>


    <!-- ===================================================
         PROTEÇÃO POR SOM
    ==================================================== -->

    <section class="section">

        <div class="label">
            Barulho alto
        </div>

        <div class="palma">

            <div
                class="palma-icon"
                aria-hidden="true"
            ></div>

            <h3>
                Proteção por som
            </h3>

            <p>
                Ative ajuda automática ao detectar
                sons altos e situações suspeitas.
            </p>

            <button
                id="ativarPalmas"
                type="button"
            >
                Ativar proteção
            </button>

            <button
                id="desativarPalmas"
                type="button"
            >
                Desativar
            </button>

        </div>

    </section>


    <!-- ===================================================
         MOVIMENTO
    ==================================================== -->

    <section class="section">

        <div class="label">
            Movimento
        </div>

        <button
            id="protecao"
            class="desativado"
            type="button"
        >

            <span>
                Balançar o celular
                para pedir ajuda
            </span>

            <br>

            <strong>
                DESATIVADO
            </strong>

        </button>

    </section>


    <!-- ===================================================
         AJUDA RÁPIDA
    ==================================================== -->

    <section class="section">

        <div class="label">
            Ajuda rápida
        </div>

        <button
            class="btn policia"
            type="button"
            onclick="ligar('190')"
        >
            Polícia (190)
        </button>

        <button
            class="btn samu"
            type="button"
            onclick="ligar('192')"
        >
            SAMU (192)
        </button>

        <button
            class="btn mulher"
            type="button"
            onclick="ligar('180')"
        >
            Central da Mulher (180)
        </button>

        <button
            class="btn zap"
            type="button"
            onclick="whatsapp180()"
        >
            WhatsApp 180
        </button>

    </section>


    <!-- ===================================================
         BRILHO
    ==================================================== -->

    <section class="section">

        <div class="label">
            Brilho
        </div>

        <button
            class="local99"
            id="brilho"
            type="button"
        >

            Escurecimento por inclinação

            <br><br>

            DESATIVADO

        </button>

    </section>


    <!-- ===================================================
         LOCALIZAÇÃO
    ==================================================== -->

    <section class="section">

        <div class="label">
            Localização
        </div>

        <button
            class="local"
            type="button"
            onclick="enviarLocalizacao()"
        >
            Enviar localização
        </button>

    </section>


    <!-- ===================================================
         CONTATOS
    ==================================================== -->

    <section class="section">

        <div class="label">
            Contatos de confiança
        </div>

        <button
            class="btn contato"
            type="button"
            onclick="selecionarContato()"
        >
            Adicionar contato
        </button>

        <button
            class="btn sos-contatos"
            type="button"
            onclick="enviarSOSContatos()"
        >
            SOS contatos
        </button>

    </section>


</main>

<script>

/* =========================================================
   UTILITÁRIOS
========================================================= */

function vibrar(duracao = 100) {

    try {

        if (navigator.vibrate) {
            navigator.vibrate(duracao);
        }

    } catch (e) {}

}


function chamarAndroid(nome, ...args) {

    try {

        if (
            window.Android &&
            typeof window.Android[nome] === "function"
        ) {

            return window.Android[nome](...args);

        }

    } catch (e) {

        console.warn(
            "Android." + nome,
            e
        );

    }

    return null;
}


/* =========================================================
   SOS
========================================================= */

const panic =
    document.getElementById("panic");


panic.addEventListener(
    "click",
    ativarSOS
);


function ativarSOS() {

    vibrar(300);

    panic.style.transform =
        "scale(.96)";

    setTimeout(() => {

        panic.style.transform =
            "";

    }, 120);


    /*
     * Primeiro tenta usar a interface
     * nativa do Android.
     */

    if (
        window.Android &&
        typeof Android.ligarDireto === "function"
    ) {

        try {

            Android.ligarDireto("180");

            return;

        } catch (e) {

            console.warn(e);

        }

    }


    /*
     * Caso esteja rodando diretamente
     * no navegador/WebView sem a interface
     * Android, tenta tel:.
     */

    try {

        window.location.href =
            "tel:180";

    } catch (e) {

        alert(
            "Não foi possível iniciar a ligação."
        );

    }

}


/* =========================================================
   LIGAÇÃO
========================================================= */

function ligar(numero) {

    if (!numero) return;

    vibrar(60);

    try {

        window.location.href =
            "tel:" + numero;

    } catch (e) {

        alert(
            "Não foi possível iniciar a ligação."
        );

    }

}


/* =========================================================
   WHATSAPP 180
========================================================= */

function whatsapp180() {

    vibrar(60);

    const url =
        "https://wa.me/556196100180";

    try {

        window.location.href = url;

    } catch (e) {

        window.open(
            url,
            "_blank"
        );

    }

}


/* =========================================================
   LOCALIZAÇÃO
========================================================= */

function enviarLocalizacao() {

    if (
        !navigator.geolocation
    ) {

        alert(
            "A geolocalização não é suportada neste dispositivo."
        );

        return;

    }


    vibrar(60);


    navigator.geolocation.getCurrentPosition(

        function(pos) {

            const latitude =
                pos.coords.latitude;

            const longitude =
                pos.coords.longitude;


            const link =
                "https://maps.google.com/?q=" +
                latitude +
                "," +
                longitude;


            const mensagem =
                "🚨 SOCORRO! Estou aqui: " +
                link;


            const url =
                "https://wa.me/556196100180?text=" +
                encodeURIComponent(
                    mensagem
                );


            window.location.href =
                url;

        },

        function(error) {

            console.warn(
                "Geolocalização:",
                error
            );

            alert(
                "Não foi possível obter sua localização. " +
                "Verifique se a localização está ativada."
            );

        },

        {
            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 5000
        }

    );

}


/* =========================================================
   PROTEÇÃO POR SOM
========================================================= */

const ativarPalmas =
    document.getElementById(
        "ativarPalmas"
    );

const desativarPalmas =
    document.getElementById(
        "desativarPalmas"
    );


function atualizarPalmasUI(ativa) {

    if (ativa) {

        ativarPalmas.innerText =
            "Proteção ativada";

        ativarPalmas.style.filter =
            "brightness(1.08)";

    } else {

        ativarPalmas.innerText =
            "Ativar proteção";

        ativarPalmas.style.filter =
            "";

    }

}


ativarPalmas.addEventListener(
    "click",
    function() {

        vibrar(70);

        chamarAndroid(
            "ativarPalmas"
        );

        /*
         * Mantém a interface funcionando
         * mesmo quando a ponte Android não existe.
         */

        atualizarPalmasUI(true);

    }
);


desativarPalmas.addEventListener(
    "click",
    function() {

        vibrar(50);

        chamarAndroid(
            "desativarPalmas"
        );

        atualizarPalmasUI(false);

    }
);


/* =========================================================
   PROTEÇÃO POR MOVIMENTO
========================================================= */

const protecao =
    document.getElementById(
        "protecao"
    );

let protecaoAtiva = false;


function atualizarProtecaoUI() {

    if (protecaoAtiva) {

        protecao.classList.remove(
            "desativado"
        );

        protecao.classList.add(
            "ativo"
        );

        protecao.innerHTML = `
            <span>
                Balançar o celular
                para pedir ajuda
            </span>

            <br>

            <strong>
                ATIVADO
            </strong>
        `;

    } else {

        protecao.classList.remove(
            "ativo"
        );

        protecao.classList.add(
            "desativado"
        );

        protecao.innerHTML = `
            <span>
                Balançar o celular
                para pedir ajuda
            </span>

            <br>

            <strong>
                DESATIVADO
            </strong>
        `;

    }

}


protecao.addEventListener(
    "click",
    function() {

        protecaoAtiva =
            !protecaoAtiva;

        vibrar(70);

        if (protecaoAtiva) {

            chamarAndroid(
                "ativarProtecao"
            );

        } else {

            chamarAndroid(
                "desativarProtecao"
            );

        }

        atualizarProtecaoUI();

    }
);


/* =========================================================
   BRILHO
========================================================= */

const btnBrilho =
    document.getElementById(
        "brilho"
    );


let brilhoAtivo = false;


function atualizarBrilhoUI() {

    if (brilhoAtivo) {

        btnBrilho.classList.remove(
            "local99"
        );

        btnBrilho.classList.add(
            "local999"
        );

        btnBrilho.innerHTML =
            "Escurecimento por inclinação" +
            "<br><br>" +
            "ATIVADO";

    } else {

        btnBrilho.classList.remove(
            "local999"
        );

        btnBrilho.classList.add(
            "local99"
        );

        btnBrilho.innerHTML =
            "Escurecimento por inclinação" +
            "<br><br>" +
            "DESATIVADO";

    }

}


btnBrilho.addEventListener(
    "click",
    function() {

        brilhoAtivo =
            !brilhoAtivo;

        vibrar(60);


        if (brilhoAtivo) {

            if (
                window.TiltBrightness &&
                typeof TiltBrightness.startTiltBrightness ===
                    "function"
            ) {

                try {

                    TiltBrightness
                        .startTiltBrightness();

                } catch (e) {

                    console.warn(e);

                }

            }

        } else {

            if (
                window.TiltBrightness &&
                typeof TiltBrightness.stopTiltBrightness ===
                    "function"
            ) {

                try {

                    TiltBrightness
                        .stopTiltBrightness();

                } catch (e) {

                    console.warn(e);

                }

            }

        }


        atualizarBrilhoUI();

    }
);


/*
 * Evento enviado pelo Android quando
 * o sistema detectar inclinação/brilho.
 */

window.addEventListener(
    "tiltbrightness",
    function(e) {

        if (
            e.detail === "dark"
        ) {

            brilhoAtivo = true;

            atualizarBrilhoUI();

        }

    }
);


/* =========================================================
   CONTATOS
========================================================= */

function selecionarContato() {

    vibrar(60);

    if (
        chamarAndroid(
            "abrirContatos"
        ) !== null
    ) {

        return;

    }

    alert(
        "A função de contatos precisa da integração com o Android."
    );

}


function enviarSOSContatos() {

    vibrar(150);

    if (
        chamarAndroid(
            "enviarSOS"
        ) !== null
    ) {

        return;

    }

    alert(
        "A função SOS dos contatos precisa da integração com o Android."
    );

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        atualizarPalmasUI(false);

        atualizarProtecaoUI();

        atualizarBrilhoUI();

    }
);

</script>

<script>
const toggle = document.getElementById("toggle");
const alavanca = document.getElementById("alavanca");

const icon1 = document.querySelector(".icon1");
const icon2 = document.querySelector(".icon2");

let ativo = false;

toggle.addEventListener("click", () => {

    ativo = !ativo;

    /* ================================
       PRIMEIRO: MOVE A ALAVANCA
    ================================= */

    alavanca.style.transform = ativo
        ? "translateX(100%)"
        : "translateX(0)";


    /* ================================
       DEPOIS: TROCA O ÍCONE
    ================================= */

    setTimeout(() => {

        icon1.style.display = ativo
            ? "none"
            : "block";

        icon2.style.display = ativo
            ? "block"
            : "none";


        /* ================================
           POR ÚLTIMO: REDIRECIONA
        ================================= */

        if (ativo) {

            window.location.href = "index3.html";

        } else {

            window.location.href = "index2.html";

        }

    }, 300);

});
</script>

</body>
</html>
