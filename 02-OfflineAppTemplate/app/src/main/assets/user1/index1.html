<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neo Calc</title>

<style>

@font-face {
    font-family:"Quicksand";
    src:url("font.ttf") format("truetype");
    font-weight:400 800;
}

:root{
    --bg:#000;
    --panel:#101010;
    --display:#080808;
    --button:#1d1d1d;
    --action:#303030;
    --operator:#4f7cff;
    --text:#fff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Quicksand",sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    background:var(--bg);
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
}

.calculadora{
    width:100%;
    max-width:380px;
}

/* VISOR */

.tela{
    width:100%;
    height:120px;
position: relative;
    top:-65px;
    padding:20px;

    display:flex;
    align-items:flex-end;
    justify-content:flex-end;

    background:var(--display);
    
    border-radius:22px;

    color:var(--text);
    font-size:42px;
    font-weight:600;

    overflow:hidden;
    white-space:nowrap;
    user-select:none;
}

/* GRID REAL 4x5 */

.botoes{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(5,1fr);
    gap:10px;
    width: 95%;
    margin-left: 2.5%;
    margin-top: 70px;
}

/* BOTÕES */

button{
    width:100%;
    height:72px;

    border:0;
    border-radius:200px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:var(--button);
    color:white;

    font-size:23px;
    font-weight:600;

    box-shadow:none;

    transition:
        background .1s ease,
        transform .1s ease;
}

button:active{
    transform:scale(.94);
    background:#292929;
}

/* AÇÕES */

.acao{
    background:var(--action);
}

/* OPERADORES */

.operador,
.igual{
    background:var(--operator);
}

.operador:active,
.igual:active{
    background:#638cff;
}

/* ZERO */



/* SVG */

svg{
    width:28px;
    height:28px;
    pointer-events:none;
}

/* RESPONSIVO */

@media(max-width:420px){

    body{
        padding:12px;
    }

    .tela{
        height:110px;
        font-size:38px;
    }

    .botoes{
        gap:9px;
    }

    button{
        height:68px;
        font-size:21px;
    }

    svg{
        width:26px;
        height:26px;
    }

/* ZERO */

.zero{
    width:100%;
    height:72px;

    border:0;
    border-radius:200px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0;

    background:var(--button);
    color:white;

    font-size:23px;
    font-weight:600;

    box-shadow:none;

    transition:
        background .1s ease,
        transform .1s ease;
}

</style>
</head>

<body>

<div class="calculadora">

    <div
        class="tela"
        id="display"
        tabindex="0"
        aria-label="Visor da calculadora"
    >0</div>

    <div class="botoes">

        <!-- LINHA 1 -->

        <button
            onclick="limpar()"
            class="acao"
        >AC</button>

        <button
            onclick="apagar()"
            class="acao"
            aria-label="Apagar"
        >
            <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path
                    d="M11.142 20C8.91458 20 7.80085 20 6.87114 19.4986C5.94144 18.9971 5.35117 18.0781 4.17061 16.24L3.48981 15.18C2.4966 13.6336 2 12.8604 2 12C2 11.1396 2.4966 10.3664 3.48981 8.82001L4.17061 7.76001C5.35117 5.92191 5.94144 5.00286 6.87114 4.50143C7.80085 4 8.91458 4 11.142 4L13.779 4C17.6544 4 19.5921 4 20.7961 5.17157C22 6.34315 22 8.22876 22 12C22 15.7712 22 17.6569 20.7961 18.8284C19.5921 20 17.6544 20 13.779 20H11.142Z"
                    stroke="white"
                    stroke-width="1.5"
                />
                <path
                    d="M15.5 9.50002L10.5 14.5M10.5 9.5L15.5 14.5"
                    stroke="white"
                    stroke-width="1.5"
                    stroke-linecap="round"
                />
            </svg>
        </button>

        <button
            onclick="porcentagem()"
            class="acao"
        >%</button>

        <button
            onclick="operacao('/')"
            class="operador"
        >÷</button>


        <!-- LINHA 2 -->

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>

        <button
            onclick="operacao('*')"
            class="operador"
        >×</button>


        <!-- LINHA 3 -->

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>

        <button
            onclick="operacao('-')"
            class="operador"
        >−</button>


        <!-- LINHA 4 -->

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>

        <button
            onclick="operacao('+')"
            class="operador"
        >+</button>


        <!-- LINHA 5 -->
        <button
            
            class="zero"
        >()</button>
        
        <button
            onclick="add('0')"
            class="zero"
        >0</button>

        <button onclick="add('.')">.</button>

        <button
            onclick="calcular()"
            class="igual"
        >=</button>

    </div>

</div>

<script>

const CHAVE_SENHA="senha";
const CHAVE_RECUPERACAO="nome_recuperacao";

const display=document.getElementById("display");

let expr="";
let contadorToques=0;
let timerToques=null;


/* SENHA */

function inicializarSenha(){

    let senhaSalva="";

    try{
        senhaSalva=String(
            Cripto.carregar(CHAVE_SENHA)||""
        ).trim();
    }catch(e){
        senhaSalva="";
    }

    if(senhaSalva){
        atualizar();
        return;
    }

    const novaSenha=prompt("Crie uma senha");

    if(!novaSenha || !novaSenha.trim()){
        location.reload();
        return;
    }

    const resposta=prompt(
        "Como você gosta de ser chamada?"
    );

    if(!resposta || !resposta.trim()){
        location.reload();
        return;
    }

    try{

        Cripto.salvar(
            CHAVE_SENHA,
            novaSenha.trim()
        );

        Cripto.salvar(
            CHAVE_RECUPERACAO,
            resposta.trim().toLowerCase()
        );

    }catch(e){

        alert("Não foi possível salvar os dados.");
        return;
    }

    location.reload();
}


/* VISOR */

function atualizar(){

    display.innerText =
        expr.length
        ? expr
        : "0";
}

/* NÚMEROS */

function add(valor){

    if(valor==="."){

        const parteAtual=
            expr.split(/[+\-*/]/).pop();

        if(parteAtual.includes(".")){
            return;
        }
    }

    expr+=valor;
    atualizar();
}


/* OPERAÇÕES */

function operacao(op){

    if(!expr){

        if(op==="-"){
            expr="-";
            atualizar();
        }

        return;
    }

    if(/[+\-*/]$/.test(expr)){

        expr=
            expr.slice(0,-1)+op;

    }else{

        expr+=op;
    }

    atualizar();
}


/* PORCENTAGEM */

function porcentagem(){

    if(!expr)return;

    expr=expr.replace(
        /(\d+(?:\.\d+)?)$/,
        "($1/100)"
    );

    atualizar();
}


/* LIMPAR */

function limpar(){

    expr="";
    atualizar();
}


/* APAGAR */

function apagar(){

    expr=
        expr.slice(0,-1);

    atualizar();
}


/* CALCULAR */

function calcular(){

    const senha=
        String(
            Cripto.carregar(CHAVE_SENHA)||""
        ).trim();

    if(
        expr.trim()!=="" &&
        expr.trim()===senha
    ){

        window.location.href=
            "file:///android_asset/user1/index2.html";

        return;
    }

    try{

        const resultado=
            Function(
                '"use strict";return ('+
                expr+
                ')'
            )();

        if(
            typeof resultado==="number" &&
            Number.isFinite(resultado)
        ){

            display.innerText=
                String(resultado);

            expr=
                String(resultado);

            return;
        }

    }catch(e){}

    mostrarMensagem("Erro");

    expr="";
}


/* MENSAGEM */

function mostrarMensagem(
    texto,
    tempo=1000
){

    display.innerText=texto;

    clearTimeout(
        mostrarMensagem.timer
    );

    mostrarMensagem.timer=
        setTimeout(
            atualizar,
            tempo
        );
}


/* RECUPERAÇÃO */

function recuperarSenha(){

    let respostaSalva="";

    try{

        respostaSalva=
            String(
                Cripto.carregar(
                    CHAVE_RECUPERACAO
                )||""
            )
            .toLowerCase()
            .trim();

    }catch(e){

        mostrarMensagem("Erro",1500);
        return;
    }

    const resposta=
        prompt(
            "Como você gosta de ser chamada?"
        );

    if(
        !resposta ||
        resposta.toLowerCase().trim()!==respostaSalva
    ){

        mostrarMensagem(
            "Resposta incorreta",
            1500
        );

        return;
    }

    const novaSenha=
        prompt("Digite a nova senha");

    if(
        !novaSenha ||
        !novaSenha.trim()
    ){
        return;
    }

    const confirmarSenha=
        prompt("Confirme a nova senha");

    if(confirmarSenha!==novaSenha){

        mostrarMensagem(
            "Senhas diferentes",
            1500
        );

        return;
    }

    Cripto.salvar(
        CHAVE_SENHA,
        novaSenha.trim()
    );

    const trocarResposta=
        confirm(
            "Deseja alterar a resposta de recuperação?"
        );

    if(trocarResposta){

        const novaResposta=
            prompt(
                "Como você gosta de ser chamada?"
            );

        if(
            novaResposta &&
            novaResposta.trim()
        ){

            Cripto.salvar(
                CHAVE_RECUPERACAO,
                novaResposta
                    .trim()
                    .toLowerCase()
            );
        }
    }

    mostrarMensagem(
        "Senha alterada",
        1500
    );

    expr="";
}


/* CINCO TOQUES */

function registrarToque(){

    contadorToques++;

    clearTimeout(timerToques);

    if(contadorToques>=5){

        contadorToques=0;
        recuperarSenha();
        return;
    }

    timerToques=setTimeout(
        ()=>{
            contadorToques=0;
        },
        2000
    );
}

display.addEventListener(
    "click",
    registrarToque
);


/* TECLADO */

document.addEventListener(
    "keydown",
    e=>{

        if(/^\d$/.test(e.key)){

            add(e.key);

        }else if(
            ["+","-","*","/"].includes(e.key)
        ){

            operacao(e.key);

        }else if(e.key==="."){

            add(".");

        }else if(e.key==="Backspace"){

            apagar();

        }else if(e.key==="Escape"){

            limpar();

        }else if(
            e.key==="Enter" ||
            e.key==="="
        ){

            calcular();

        }else if(e.key==="%"){

            porcentagem();
        }
    }
);


inicializarSenha();
atualizar();

</script>

</body>
</html>
