<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Neo Calc</title>

<style>

/* Barra inteira */
::-webkit-scrollbar{
    width:10px;
}

/* Fundo */
::-webkit-scrollbar-track{
    background:#000;
}

/* Parte que desliza */
::-webkit-scrollbar-thumb{
    background:#000;
    border-radius:999px;
    border:2px solid #000;
}

/* Canto (quando há barra horizontal e vertical) */
::-webkit-scrollbar-corner{
    background:#000;
}


@font-face {
  font-family: "Quicksand";
  src: url("font.ttf") format("truetype");
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Quicksand', sans-serif;
}

body{
    background:#000;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.calculadora{
    width:100%;
    max-width:360px;
}

.tela{
    height:120px;
    background:#111;
    border:1px solid #222;
    border-radius:24px;

    display:flex;
    align-items:flex-end;
    justify-content:flex-end;

    padding:24px;

    color:#fff;
    font-size:42px;
    font-weight:600;

    margin-bottom:16px;

    overflow:hidden;
}

.botoes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

button{
    height:72px;
    border:none;
    border-radius:222px;

    background:#1b1b1b;
    color:white;

    font-size:24px;
    font-weight:600;

    transition:.15s;
    display: flex;
    justify-content: center;
    align-items: center;
}

button:active{
    transform:scale(.95);
}

.acao{
    background:#242424;
}

.igual{
    background:#4f7cff;
}


svg {
width: 35px;
height: 35px;
}
</style>
</head>
<body>

<div class="calculadora">

    <div class="tela" id="display">0</div>

<div class="botoes">

    <button onclick="limpar()" class="acao">C</button>
    <button onclick="apagar()" class="acao">
    <!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">

<!-- Uploaded to: SVG Repo, www.svgrepo.com, Transformed by: SVG Repo Mixer Tools -->

<g id="SVGRepo_bgCarrier" stroke-width="0"/>

<g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"/>

<g id="SVGRepo_iconCarrier"> <path d="M11.142 20C8.91458 20 7.80085 20 6.87114 19.4986C5.94144 18.9971 5.35117 18.0781 4.17061 16.24L3.48981 15.18C2.4966 13.6336 2 12.8604 2 12C2 11.1396 2.4966 10.3664 3.48981 8.82001L4.17061 7.76001C5.35117 5.92191 5.94144 5.00286 6.87114 4.50143C7.80085 4 8.91458 4 11.142 4L13.779 4C17.6544 4 19.5921 4 20.7961 5.17157C22 6.34315 22 8.22876 22 12C22 15.7712 22 17.6569 20.7961 18.8284C19.5921 20 17.6544 20 13.779 20H11.142Z" stroke="#ffffff" stroke-width="1.5"/> <path d="M15.5 9.50002L10.5 14.5M10.5 9.5L15.5 14.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/> </g>

</svg>
    </button>
    <button onclick="calcular()" class="igual">=</button>

    <button onclick="add('1')">1</button>
    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>

    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>

    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>

    <button></button>
    <button onclick="add('0')">0</button>
    <button></button>

</div>

</div>

<script>
const CHAVE_SENHA = "senha";
const CHAVE_RECUPERACAO = "nome_recuperacao";

let senhaSalva = Cripto.carregar(CHAVE_SENHA);

if (!senhaSalva) {

    const novaSenha = prompt("Crie uma senha");

    if (novaSenha && novaSenha.trim() !== "") {

        const resposta = prompt(
            "Como você gosta de ser chamada?"
        );

        if (resposta && resposta.trim() !== "") {

            Cripto.salvar(
                CHAVE_SENHA,
                novaSenha.trim()
            );

            Cripto.salvar(
                CHAVE_RECUPERACAO,
                resposta.trim().toLowerCase()
            );

            location.reload();

        } else {

            location.reload();
        }

    } else {

        location.reload();
    }
}

let expr = "";
const display = document.getElementById("display");

function atualizar() {

    display.innerText =
        expr.length > 0
        ? "•".repeat(expr.length)
        : "0";
}

function add(numero) {

    expr += numero;
    atualizar();
}

function limpar() {

    expr = "";
    atualizar();
}

function apagar() {

    expr = expr.slice(0, -1);
    atualizar();
}

function calcular() {

    const senha = String(
        Cripto.carregar(CHAVE_SENHA) || ""
    ).trim();

    if (expr.trim() === senha) {

        window.location.href =
            "file:///android_asset/user1/index2.html";

    } else {

        display.innerText = "Erro";

        expr = "";

        setTimeout(() => {
            atualizar();
        }, 1000);
    }
}

function recuperarSenha() {

    const respostaSalva = String(
        Cripto.carregar(CHAVE_RECUPERACAO) || ""
    ).toLowerCase().trim();

    const resposta = prompt(
        "Como você gosta de ser chamada?"
    );

    if (
        !resposta ||
        resposta.toLowerCase().trim() !== respostaSalva
    ) {

        display.innerText = "Resposta incorreta";

        setTimeout(() => {
            atualizar();
        }, 1500);

        return;
    }

    const novaSenha = prompt(
        "Digite a nova senha"
    );

    if (
        !novaSenha ||
        novaSenha.trim() === ""
    ) {
        return;
    }

    const confirmarSenha = prompt(
        "Confirme a nova senha"
    );

    if (confirmarSenha !== novaSenha) {

        display.innerText = "Senhas diferentes";

        setTimeout(() => {
            atualizar();
        }, 1500);

        return;
    }

    Cripto.salvar(
        CHAVE_SENHA,
        novaSenha.trim()
    );

    const trocarResposta = confirm(
        "Deseja alterar a resposta de recuperação?"
    );

    if (trocarResposta) {

        const novaResposta = prompt(
            "Como você gosta de ser chamada?"
        );

        if (
            novaResposta &&
            novaResposta.trim() !== ""
        ) {

            Cripto.salvar(
                CHAVE_RECUPERACAO,
                novaResposta.trim().toLowerCase()
            );
        }
    }

    display.innerText = "Senha alterada";

    setTimeout(() => {

        expr = "";
        atualizar();

    }, 1500);
}

/* 5 toques no visor */

let contadorToques = 0;
let timerToques = null;

function registrarToque() {

    contadorToques++;

    clearTimeout(timerToques);

    if (contadorToques >= 5) {

        contadorToques = 0;
        recuperarSenha();
        return;
    }

    timerToques = setTimeout(() => {

        contadorToques = 0;

    }, 2000);
}

display.addEventListener(
    "click",
    registrarToque
);

display.addEventListener(
    "touchend",
    registrarToque
);

atualizar();
</script>

</body>
</html>
