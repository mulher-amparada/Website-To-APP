<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neo Calc</title>

<style>
@font-face {
    font-family: "Quicksand";
    src: url("font.ttf") format("truetype");
    font-weight: 400 800;
}

:root {
    --bg: #000;
    --button: #151515;
    --button-hover: #202020;
    --action: #292929;
    --action-hover: #353535;
    --operator: #4f7cff;
    --operator-hover: #638cff;
    --text: #fff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    font-family: "Quicksand", sans-serif;

    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
}

html,
body {
    width: 100%;
    min-height: 100%;

    background: #000;
}

body {
    min-height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));

    overflow-x: hidden;
}


/* =====================================================
   CALCULADORA
===================================================== */

.calculadora {
    width: min(100%, 430px);

    display: flex;
    flex-direction: column;

    gap: clamp(12px, 3vw, 22px);
}


/* =====================================================
   VISOR
===================================================== */

.tela {
    width: 100%;

    min-height: clamp(125px, 24dvh, 220px);

    padding:
        clamp(18px, 5vw, 30px)
        clamp(18px, 5vw, 30px)
        clamp(12px, 3vw, 22px);

    display: flex;

    margin-bottom: 40%;

    align-items: flex-end;
    justify-content: flex-end;

    background: #000;

    border-radius: clamp(20px, 5vw, 32px);

    color: var(--text);

    font-size: clamp(38px, 11vw, 64px);
    font-weight: 600;

    line-height: 1;

    overflow: hidden;

    white-space: nowrap;

    user-select: none;

    text-align: right;
}


/* =====================================================
   GRID DOS BOTÕES
===================================================== */

.botoes {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: clamp(8px, 2.5vw, 14px);
}


/* =====================================================
   BOTÕES
===================================================== */

button {
    width: 100%;

    aspect-ratio: 1 / 1;

    min-width: 0;
    min-height: 0;

    border: 0;
    outline: 0;

    border-radius: 200px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--button);
    color: var(--text);

    font-size: clamp(20px, 6vw, 27px);
    font-weight: 600;

    padding: 0;
    margin: 0;

    cursor: pointer;

    transition:
        transform .12s ease,
        background .12s ease;
}


/* =====================================================
   ZERO
===================================================== */

.zero {
    width: 100%;

    aspect-ratio: 1 / 1;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 0;
    margin: 0;

    border-radius: 200px;
}


/* =====================================================
   HOVER
===================================================== */

button:hover {
    background: var(--button-hover);
}


/* =====================================================
   CLIQUE
===================================================== */

button:active {
    transform: scale(.90);
}


/* =====================================================
   BOTÕES DE AÇÃO
===================================================== */

.acao {
    background: var(--action);
}

.acao:hover {
    background: var(--action-hover);
}


/* =====================================================
   OPERADORES
===================================================== */

.operador,
.igual {
    background: var(--operator);
}

.operador:hover,
.igual:hover {
    background: var(--operator-hover);
}

.operador:active,
.igual:active {
    background: var(--operator-hover);
}


/* =====================================================
   SVG
===================================================== */

svg {
    width: clamp(23px, 7vw, 31px);
    height: clamp(23px, 7vw, 31px);

    pointer-events: none;
}


/* =====================================================
   CELULARES PEQUENOS
===================================================== */

@media (max-width: 360px) {

    body {
        padding: 8px;
    }

    .calculadora {
        gap: 10px;
    }

    .botoes {
        gap: 7px;
    }

    .tela {
        min-height: 100px;

        padding: 15px;

        font-size: 34px;
    }

    button {
        font-size: 19px;
    }

    svg {
        width: 23px;
        height: 23px;
    }
}


/* =====================================================
   TELAS GRANDES
===================================================== */

@media (min-width: 600px) {

    .calculadora {
        width: min(90vw, 430px);
    }
}


/* =====================================================
   TELAS BAIXAS
===================================================== */

@media (max-height: 700px) {

    body {
        align-items: flex-start;

        padding-top: 8px;
        padding-bottom: 8px;
    }

    .calculadora {
        margin-top: 0;
    }

    .tela {
        min-height: 105px;
    }
}


/* =====================================================
   LANDSCAPE
===================================================== */

@media (orientation: landscape) and (max-height: 600px) {

    body {
        align-items: center;

        overflow-y: auto;
    }

    .calculadora {
        width: min(90vw, 650px);

        display: grid;

        grid-template-columns: .9fr 1.4fr;

        align-items: center;

        gap: 25px;
    }

    .tela {
        min-height: 260px;

        font-size: clamp(36px, 7vw, 58px);
    }

    .botoes {
        gap: 8px;
    }

    button {
        font-size: clamp(18px, 4vw, 25px);
    }
}



</style>

</head>

<body>

<div class="calculadora">

    <!-- =================================================
         VISOR
    ================================================== -->

    <div
        class="tela"
        id="display"
        tabindex="0"
        role="status"
        aria-live="polite"
        aria-label="Visor da calculadora"
    >0</div>


    <!-- =================================================
         TECLADO
    ================================================== -->

    <div class="botoes">

        <!-- ================= LINHA 1 ================= -->

        <button
            type="button"
            class="acao"
            onclick="limpar()"
            aria-label="Limpar calculadora"
        >
            AC
        </button>

        <button
            type="button"
            class="acao"
            onclick="apagar()"
            aria-label="Apagar último caractere"
        >
            <svg
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
            >
                <path
                    d="M11.142 20C8.91458 20 7.80085 20 6.87114 19.4986C5.94144 18.9971 5.35117 18.0781 4.17061 16.24L3.48981 15.18C2.4966 13.6336 2 12.8604 2 12C2 11.1396 2.4966 10.3664 3.48981 8.82001L4.17061 7.76001C5.35117 5.92191 5.94144 5.00286 6.87114 4.50143C7.80085 4 8.91458 4 11.142 4L13.779 4C17.6544 4 19.5921 4 20.7961 5.17157C22 6.34315 22 8.22876 22 12C22 15.7712 22 17.6569 20.7961 18.8284C19.5921 20 17.6544 20 13.779 20H11.142Z"
                    stroke="currentColor"
                    stroke-width="1.5"
                />

                <path
                    d="M15.5 9.50002L10.5 14.5M10.5 9.5L15.5 14.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                />
            </svg>
        </button>

        <button
            type="button"
            class="acao"
            onclick="porcentagem()"
            aria-label="Porcentagem"
        >
            %
        </button>

        <button
            type="button"
            class="operador"
            onclick="operacao('/')"
            aria-label="Divisão"
        >
            ÷
        </button>


        <!-- ================= LINHA 2 ================= -->

        <button
            type="button"
            onclick="add('7')"
            aria-label="7"
        >7</button>

        <button
            type="button"
            onclick="add('8')"
            aria-label="8"
        >8</button>

        <button
            type="button"
            onclick="add('9')"
            aria-label="9"
        >9</button>

        <button
            type="button"
            class="operador"
            onclick="operacao('*')"
            aria-label="Multiplicação"
        >
            ×
        </button>


        <!-- ================= LINHA 3 ================= -->

        <button
            type="button"
            onclick="add('4')"
            aria-label="4"
        >4</button>

        <button
            type="button"
            onclick="add('5')"
            aria-label="5"
        >5</button>

        <button
            type="button"
            onclick="add('6')"
            aria-label="6"
        >6</button>

        <button
            type="button"
            class="operador"
            onclick="operacao('-')"
            aria-label="Subtração"
        >
            −
        </button>


        <!-- ================= LINHA 4 ================= -->

        <button
            type="button"
            onclick="add('1')"
            aria-label="1"
        >1</button>

        <button
            type="button"
            onclick="add('2')"
            aria-label="2"
        >2</button>

        <button
            type="button"
            onclick="add('3')"
            aria-label="3"
        >3</button>

        <button
            type="button"
            class="operador"
            onclick="operacao('+')"
            aria-label="Adição"
        >
            +
        </button>


        <!-- ================= LINHA 5 ================= -->

        <button
            type="button"
            class="especial"
            onclick="add('(')"
            aria-label="Parêntese esquerdo"
        >
            ()
        </button>

<button
    type="button"
    class="zero"
    onclick="add('0')"
    aria-label="0"
>
    0
</button>

        <button
            type="button"
            onclick="add('.')"
            aria-label="Ponto decimal"
        >
            .
        </button>

        <button
            type="button"
            class="igual"
            onclick="calcular()"
            aria-label="Calcular resultado"
        >
            =
        </button>

    </div>

</div>

<script>

const CHAVE_SENHA="senha";
const CHAVE_RECUPERACAO="nome_recuperacao";

const display=document.getElementById("display");

let expr="";
let contadorToques=0;
let timerToques=null;


/* SENHA */

function inicializarSenha(){

    let senhaSalva="";

    try{
        senhaSalva=String(
            Cripto.carregar(CHAVE_SENHA)||""
        ).trim();
    }catch(e){
        senhaSalva="";
    }

    if(senhaSalva){
        atualizar();
        return;
    }

    const novaSenha=prompt("Crie uma senha");

    if(!novaSenha || !novaSenha.trim()){
        location.reload();
        return;
    }

    const resposta=prompt(
        "Como você gosta de ser chamada?"
    );

    if(!resposta || !resposta.trim()){
        location.reload();
        return;
    }

    try{

        Cripto.salvar(
            CHAVE_SENHA,
            novaSenha.trim()
        );

        Cripto.salvar(
            CHAVE_RECUPERACAO,
            resposta.trim().toLowerCase()
        );

    }catch(e){

        alert("Não foi possível salvar os dados.");
        return;
    }

    location.reload();
}


/* VISOR */

function atualizar(){

    display.innerText =
        expr.length
        ? expr
        : "0";
}

/* NÚMEROS */

function add(valor){

    if(valor==="."){

        const parteAtual=
            expr.split(/[+\-*/]/).pop();

        if(parteAtual.includes(".")){
            return;
        }
    }

    expr+=valor;
    atualizar();
}


/* OPERAÇÕES */

function operacao(op){

    if(!expr){

        if(op==="-"){
            expr="-";
            atualizar();
        }

        return;
    }

    if(/[+\-*/]$/.test(expr)){

        expr=
            expr.slice(0,-1)+op;

    }else{

        expr+=op;
    }

    atualizar();
}


/* PORCENTAGEM */

function porcentagem(){

    if(!expr)return;

    expr=expr.replace(
        /(\d+(?:\.\d+)?)$/,
        "($1/100)"
    );

    atualizar();
}


/* LIMPAR */

function limpar(){

    expr="";
    atualizar();
}


/* APAGAR */

function apagar(){

    expr=
        expr.slice(0,-1);

    atualizar();
}


/* CALCULAR */

function calcular(){

    const senha=
        String(
            Cripto.carregar(CHAVE_SENHA)||""
        ).trim();

    if(
        expr.trim()!=="" &&
        expr.trim()===senha
    ){

        window.location.href=
            "file:///android_asset/user1/index2.html";

        return;
    }

    try{

        const resultado=
            Function(
                '"use strict";return ('+
                expr+
                ')'
            )();

        if(
            typeof resultado==="number" &&
            Number.isFinite(resultado)
        ){

            display.innerText=
                String(resultado);

            expr=
                String(resultado);

            return;
        }

    }catch(e){}

    mostrarMensagem("Erro");

    expr="";
}


/* MENSAGEM */

function mostrarMensagem(
    texto,
    tempo=1000
){

    display.innerText=texto;

    clearTimeout(
        mostrarMensagem.timer
    );

    mostrarMensagem.timer=
        setTimeout(
            atualizar,
            tempo
        );
}


/* RECUPERAÇÃO */

function recuperarSenha(){

    let respostaSalva="";

    try{

        respostaSalva=
            String(
                Cripto.carregar(
                    CHAVE_RECUPERACAO
                )||""
            )
            .toLowerCase()
            .trim();

    }catch(e){

        mostrarMensagem("Erro",1500);
        return;
    }

    const resposta=
        prompt(
            "Como você gosta de ser chamada?"
        );

    if(
        !resposta ||
        resposta.toLowerCase().trim()!==respostaSalva
    ){

        mostrarMensagem(
            "Resposta incorreta",
            1500
        );

        return;
    }

    const novaSenha=
        prompt("Digite a nova senha");

    if(
        !novaSenha ||
        !novaSenha.trim()
    ){
        return;
    }

    const confirmarSenha=
        prompt("Confirme a nova senha");

    if(confirmarSenha!==novaSenha){

        mostrarMensagem(
            "Senhas diferentes",
            1500
        );

        return;
    }

    Cripto.salvar(
        CHAVE_SENHA,
        novaSenha.trim()
    );

    const trocarResposta=
        confirm(
            "Deseja alterar a resposta de recuperação?"
        );

    if(trocarResposta){

        const novaResposta=
            prompt(
                "Como você gosta de ser chamada?"
            );

        if(
            novaResposta &&
            novaResposta.trim()
        ){

            Cripto.salvar(
                CHAVE_RECUPERACAO,
                novaResposta
                    .trim()
                    .toLowerCase()
            );
        }
    }

    mostrarMensagem(
        "Senha alterada",
        1500
    );

    expr="";
}


/* CINCO TOQUES */

function registrarToque(){

    contadorToques++;

    clearTimeout(timerToques);

    if(contadorToques>=5){

        contadorToques=0;
        recuperarSenha();
        return;
    }

    timerToques=setTimeout(
        ()=>{
            contadorToques=0;
        },
        2000
    );
}

display.addEventListener(
    "click",
    registrarToque
);


/* TECLADO */

document.addEventListener(
    "keydown",
    e=>{

        if(/^\d$/.test(e.key)){

            add(e.key);

        }else if(
            ["+","-","*","/"].includes(e.key)
        ){

            operacao(e.key);

        }else if(e.key==="."){

            add(".");

        }else if(e.key==="Backspace"){

            apagar();

        }else if(e.key==="Escape"){

            limpar();

        }else if(
            e.key==="Enter" ||
            e.key==="="
        ){

            calcular();

        }else if(e.key==="%"){

            porcentagem();
        }
    }
);


inicializarSenha();
atualizar();

</script>

</body>
</html>
