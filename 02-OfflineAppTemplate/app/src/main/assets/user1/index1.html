<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>Apps</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    font-family: Quicksand, sans-serif;

    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}


html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    color: white;

    background: black;
}


/* =========================================================
   FONTE
========================================================= */

@font-face {

    font-family: Quicksand;

    src:
        url("font.ttf")
        format("truetype");

    font-display: swap;
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {

    width: 5px;
    height: 5px;
}

::-webkit-scrollbar-track {

    background: transparent;
}

::-webkit-scrollbar-thumb {

    background: rgba(255,255,255,.12);

    border-radius: 999px;
}


/* =========================================================
   FUNDO
========================================================= */

.fundo {

    position: fixed;

    inset: 0;

    z-index: -10;

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(255,150,150,.12),
            transparent 35%
        ),

        radial-gradient(
            circle at 100% 100%,
            rgba(255,255,255,.025),
            transparent 40%
        ),

        #000;
}


/* =========================================================
   APP
========================================================= */

main {

    width: 100%;

    height: 100vh;

    padding:
        max(18px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        110px
        max(16px, env(safe-area-inset-left));
}


/* =========================================================
   TOPO
========================================================= */

.top {

    width: 100%;

    height: 55px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;
}


.title-area {

    min-width: 0;
}


.title {

    font-size: 22px;

    font-weight: 700;

    line-height: 1;
}


.subtitle {

    margin-top: 5px;

    font-size: 11px;

    color: rgba(255,255,255,.42);

    font-weight: 500;
}


/* =========================================================
   AÇÕES
========================================================= */

.actions {

    display: flex;

    align-items: center;

    gap: 7px;
}


.action {

    width: 42px;

    height: 42px;

    border: 0;

    outline: none;

    border-radius: 14px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: white;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid rgba(255,255,255,.07);

    font-size: 19px;

    cursor: pointer;

    transition:
        transform .18s ease,
        background .18s ease,
        opacity .18s ease;
}


.action:active {

    transform: scale(.90);
}


.action:hover {

    background:
        rgba(255,255,255,.10);
}


#atualizar.loading {

    animation:
        girar .8s linear infinite;
}


/* =========================================================
   GRID
========================================================= */

.grid {

    width: 100%;

    height: calc(100vh - 165px);

    margin-top: 10px;

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 26px 10px;

    overflow-y: auto;

    overflow-x: hidden;

    padding:
        8px 3px
        30px;

    overscroll-behavior-y: contain;

    scrollbar-width: thin;
}


/* =========================================================
   APP
========================================================= */

.app {

    min-width: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-start;

    text-align: center;

    cursor: pointer;

    contain: layout paint;

    padding-bottom: 18%;

    transition:
        transform .15s ease,
        opacity .15s ease;
}


.app:active {

    transform: scale(.91);

    opacity: .65;
}


/* =========================================================
   ÍCONE
========================================================= */

.icon {

    width: 68px;

    height: 68px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 18px;

    overflow: hidden;
}


.icon img {

    width: 67px;

    height: 67px;

    display: block;

    object-fit: contain;

    border-radius: 17px;
}


/* =========================================================
   NOME
========================================================= */

.name {

    width: 100%;

    max-width: 82px;

    margin-top: 8px;

    font-size: 12px;

    line-height: 1.25;

    font-weight: 600;

    color: rgba(255,255,255,.88);

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* =========================================================
   SEM RESULTADOS
========================================================= */

.empty {

    grid-column: 1 / -1;

    min-height: 250px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    gap: 8px;

    color: rgba(255,255,255,.4);

    text-align: center;
}


.empty-icon {

    font-size: 34px;

    opacity: .5;
}


.empty-title {

    color: rgba(255,255,255,.75);

    font-size: 14px;

    font-weight: 600;
}


.empty-text {

    font-size: 11px;
}


/* =========================================================
   BARRA DE PESQUISA
========================================================= */

.search {

    position: fixed;

    left: 50%;

    bottom:
        max(20px, env(safe-area-inset-bottom));

    transform: translateX(-50%);

    z-index: 1000;

    width: min(68%, 430px);

    height: 56px;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 0 18px;

    border-radius: 999px;

    background: #333;
        border: 1px solid #444;

    box-shadow:
        0 15px 45px rgba(0,0,0,.35);

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    transition:
        width .25s ease,
        background .25s ease;
}


.search:focus-within {

    width: min(74%, 470px);

    background: #444;
    border: 1px solid #333;
}


.search svg {

    width: 22px;

    height: 22px;

    flex-shrink: 0;

    opacity: .75;
}


.search input {

    width: 100%;

    min-width: 0;

    height: 100%;

    border: 0;

    outline: none;

    background: transparent;

    color: white;

    font-size: 15px;

    font-weight: 600;

    font-family: Quicksand, sans-serif;
}


.search input::placeholder {

    color: rgba(255,255,255,.75);
}


/* =========================================================
   INDICADOR
========================================================= */

.update-status {

    position: fixed;

    top:
        max(80px, calc(65px + env(safe-area-inset-top)));

    left: 50%;

    z-index: 2000;

    transform:
        translate(-50%, -15px);

    opacity: 0;

    pointer-events: none;

    padding: 8px 14px;

    border-radius: 999px;

    background:
        rgba(20,20,20,.88);

    border:
        1px solid rgba(255,255,255,.08);

    color:
        rgba(255,255,255,.75);

    font-size: 10px;

    transition:
        opacity .2s ease,
        transform .2s ease;
}


.update-status.show {

    opacity: 1;

    transform:
        translate(-50%, 0);
}


/* =========================================================
   PULL TO REFRESH
========================================================= */

.pull-indicator {

    position: fixed;

    top: 5px;

    left: 50%;

    z-index: 3000;

    width: 34px;

    height: 34px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background:
        rgba(25,25,25,.9);

    opacity: 0;

    transform:
        translate(-50%, -45px);

    transition:
        opacity .15s ease,
        transform .15s ease;
}


.pull-indicator.visible {

    opacity: 1;

    transform:
        translate(-50%, 0);
}


.pull-indicator.refresh {

    animation:
        girar .7s linear infinite;
}


/* =========================================================
   ANIMAÇÕES
========================================================= */

@keyframes girar {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   RESPONSIVO
========================================================= */

@media (max-width: 360px) {

    main {

        padding-left: 12px;

        padding-right: 12px;
    }


    .grid {

        gap: 22px 6px;
    }


    .icon,
    .icon img {

        width: 60px;

        height: 60px;
    }


    .name {

        max-width: 70px;

        font-size: 11px;
    }


    .title {

        font-size: 20px;
    }


    .search {

        width: 76%;
    }

}


@media (orientation: landscape) {

    .grid {

        grid-template-columns:
            repeat(6, minmax(0, 1fr));

        gap: 22px 8px;
    }


    .search {

        width: 32%;
    }

}


svg {

    width: 25px;

    height: 25px;
}

</style>

</head>


<body>


<div class="fundo"></div>


<div
    class="pull-indicator"
    id="pullIndicator"
>
    ↻
</div>


<div
    class="update-status"
    id="updateStatus"
>
    Atualizando aplicativos...
</div>


<main>


    <!-- =====================================================

    ====================================================== -->

    <div class="top">


        <div class="title-area">

            <div class="title">

            <div

        </div>


        <div class="actions">

                aria-label="Atualizar aplicativos"
                title="Atualizar aplicativos"
            >

                <svg

                    xmlns="http://www.w3.org/2000/svg"

                >

                    <g>

                        />

                        <path
                            class="st0"
                            d="M274.91,147.61c-8.84,0-16,7.16-16,16V256c0,8.84,7.16,16,16,16h75.87c8.84,0,16-7.16,16-16s-7.16-16-16-16h-59.87v-76.39C290.91,154.77,283.74,147.61,274.91,147.61z"
                        />

                    </g>

                </svg>

            </button>

        </div>

    </div>


    <!-- =====================================================
         GRID
    ====================================================== -->

    <div
        class="grid"
        id="grid"
    ></div>


</main>


<!-- =========================================================
     PESQUISA
========================================================= -->

<div class="search">


    <svg
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
    >

        <path
            d="M15.7955 15.8111L21 21M18 10.5C18 14.6421 14.6421 18 10.5 18C6.35786 18 3 14.6421 3 10.5C3 6.35786 6.35786 3 10.5 3C14.6421 3 18 6.35786 18 10.5Z"
            stroke="#ffffff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        />

    </svg>


    <input
        id="pesquisaInput"
        type="text"
        placeholder="Pesquisar"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
    >

</div>

<script>

/* =========================================================
   USUÁRIO / PASTA ATIVA
========================================================= */

let usuarioAtual = "user1";


/* =========================================================
   MENSAGEM RECEBIDA DO ANDROID
========================================================= */

function receberMensagemAndroid(mensagem) {

    if (mensagem === "user2") {

        usuarioAtual = "user2";

    }

}


/* =========================================================
   ELEMENTOS
========================================================= */

const grid =
    document.getElementById("grid");

const pesquisa =
    document.getElementById("pesquisaInput");

const atualizar =
    document.getElementById("atualizar");

const contador =
    document.getElementById("contador");

const pullIndicator =
    document.getElementById("pullIndicator");


/* =========================================================
   APP PRÉ-DEFINIDO
========================================================= */

const apps = [

    {
        nome: "Calculadora",
        icone: "user2.png"
    }

];


/* =========================================================
   CAMINHO DO USUÁRIO
========================================================= */

function caminhoUsuario(arquivo) {

    return usuarioAtual + "/" + arquivo;

}


/* =========================================================
   RENDERIZAÇÃO
========================================================= */

function renderizar(lista) {

    grid.innerHTML = "";


    if (!lista.length) {

        contador.textContent =
            "Nenhum aplicativo";


        grid.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⌕
                </div>

                <div class="empty-title">
                    Nenhum aplicativo encontrado
                </div>

                <div class="empty-text">
                    Tente pesquisar outro nome
                </div>

            </div>

        `;

        return;
    }


    const termo =
        pesquisa.value
            .trim();


    contador.textContent =
        `${lista.length} ${termo ? "encontrado" : "aplicativo"}${lista.length === 1 ? "" : "s"}`;


    const fragment =
        document.createDocumentFragment();


    lista.forEach(app => {

        const elemento =
            document.createElement("div");


        elemento.className =
            "app";


        const icon =
            document.createElement("div");


        icon.className =
            "icon";


        const img =
            document.createElement("img");


        img.loading =
            "lazy";

        img.decoding =
            "async";

        img.alt =
            app.nome;


        /*
         * O ícone também usa a pasta atual.
         *
         * user1 → user1.png
         * user2 → user2.png
         */

        img.src =
            caminhoUsuario(app.icone);


        img.onerror =
            function () {

                this.style.display =
                    "none";

            };


        icon.appendChild(img);


        const nome =
            document.createElement("div");


        nome.className =
            "name";

        nome.textContent =
            app.nome;


        elemento.appendChild(icon);

        elemento.appendChild(nome);


        /* =================================================
           CLIQUE NO APP
        ================================================= */

        elemento.addEventListener(
            "click",
            function () {

                /*
                 * Aqui o JS decide qual página abrir
                 * baseado na mensagem recebida.
                 */

                if (usuarioAtual === "user2") {

                    window.location.href =
                        "user2/index11.html";

                } else {

                    window.location.href =
                        "user1/index11.html";

                }

            }
        );


        fragment.appendChild(elemento);

    });


    grid.appendChild(fragment);

}


/* =========================================================
   PESQUISA
========================================================= */

function pesquisar() {

    const termo =
        pesquisa.value
            .toLocaleLowerCase("pt-BR")
            .trim();


    if (!termo) {

        renderizar(apps);

        return;

    }


    const resultado =
        apps.filter(app =>

            app.nome
                .toLocaleLowerCase("pt-BR")
                .includes(termo)

        );


    renderizar(resultado);

}


pesquisa.addEventListener(
    "input",
    pesquisar
);


/* =========================================================
   BOTÃO ATUALIZAR
========================================================= */

atualizar.addEventListener(
    "click",
    function () {

        atualizar.classList.add(
            "loading"
        );


        setTimeout(
            function () {

                renderizar(apps);

                atualizar.classList.remove(
                    "loading"
                );

            },
            300
        );

    }
);


/* =========================================================
   PULL TO REFRESH
========================================================= */

let inicioY = 0;

let puxando = false;


grid.addEventListener(
    "touchstart",
    function (event) {

        if (
            grid.scrollTop > 0
        ) {

            return;

        }


        inicioY =
            event.touches[0].clientY;

        puxando = true;

    },
    {
        passive: true
    }
);


grid.addEventListener(
    "touchmove",
    function (event) {

        if (!puxando) {

            return;

        }


        const atualY =
            event.touches[0].clientY;


        const distancia =
            atualY - inicioY;


        if (
            distancia > 25
        ) {

            pullIndicator.classList.add(
                "visible"
            );

        }

    },
    {
        passive: true
    }
);


grid.addEventListener(
    "touchend",
    function () {

        if (!puxando) {

            return;

        }


        puxando = false;


        if (
            pullIndicator.classList.contains(
                "visible"
            )
        ) {

            pullIndicator.classList.add(
                "refresh"
            );


            setTimeout(
                function () {

                    renderizar(apps);


                    pullIndicator.classList.remove(
                        "visible",
                        "refresh"
                    );

                },
                300
            );

        }

    },
    {
        passive: true
    }
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

renderizar(apps);

</script>

</body>

</html>
