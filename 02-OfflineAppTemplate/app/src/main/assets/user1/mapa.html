<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#08080a"
>

<meta
    name="color-scheme"
    content="dark"
>

<title>Mapa</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

<style>

/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #050507;
}

body {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    color: #fff;

    font-family: "Quicksand", Arial, sans-serif;

    user-select: none;
    -webkit-user-select: none;

    overscroll-behavior: none;

    touch-action: manipulation;
}


/* =========================================================
   FONTE
========================================================= */

@font-face {

    font-family: "Quicksand";

    src:
        url("font.ttf")
        format("truetype");

    font-display: swap;
}


/* =========================================================
   FUNDO
========================================================= */

#background {

    position: fixed;

    inset: 0;

    z-index: -10;

    width: 100%;
    height: 100%;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255, 105, 180, .10),
            transparent 40%
        ),
        #050507;

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    transform: translateZ(0) scale(1.03);

    pointer-events: none;
}

#background::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.42),
            rgba(0,0,0,.68)
        );
}


/* =========================================================
   APP
========================================================= */

.app {

    position: fixed;

    inset: 0;

    width: 100%;

    /*
        dvh funciona melhor em WebView moderno.
        vh fica como fallback.
    */

    height: 100vh;
    height: 100dvh;

    min-height: 0;

    overflow: hidden;

    padding:

        max(8px, env(safe-area-inset-top))

        max(8px, env(safe-area-inset-right))

        max(8px, env(safe-area-inset-bottom))

        max(8px, env(safe-area-inset-left));

    animation: pageIn .6s ease both;
}


/* =========================================================
   ÁREA PRINCIPAL
========================================================= */

.map-wrapper {

    position: absolute;

    top:
        calc(
            max(8px, env(safe-area-inset-top)) + 64px
        );

    right:
        max(8px, env(safe-area-inset-right));

    bottom:
        max(8px, env(safe-area-inset-bottom));

    left:
        max(8px, env(safe-area-inset-left));

    min-width: 0;
    min-height: 0;

    overflow: hidden;

    border-radius: 22px;

    background: #111;

    box-shadow:
        0 20px 70px rgba(0,0,0,.65),
        0 0 0 1px rgba(255,255,255,.08);

    isolation: isolate;

    animation:
        mapIn .7s cubic-bezier(.2,.8,.2,1) both;
}


/* =========================================================
   MAPA
========================================================= */

#map {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    background: #111;

    overflow: hidden;

    outline: none;
}


/* =========================================================
   CABEÇALHO
========================================================= */

.header {

    position: absolute;

    top:
        max(
            8px,
            env(safe-area-inset-top)
        );

    left: 50%;

    transform: translateX(-50%);

    z-index: 5000;

    width: min(
        calc(100% - 24px),
        520px
    );

    height: 54px;

    min-height: 54px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    padding:
        7px
        9px
        7px
        14px;

    border:
        1px solid rgba(255,255,255,.11);

    border-radius: 17px;

    background:
        rgba(10,10,13,.78);

    backdrop-filter:
        blur(22px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(22px)
        saturate(150%);

    box-shadow:
        0 12px 35px rgba(0,0,0,.35);

    overflow: hidden;

    animation:
        headerIn .6s ease both;
}


/* =========================================================
   TÍTULO
========================================================= */

.title {

    min-width: 0;

    flex: 1 1 auto;

    display: flex;

    align-items: center;

    gap: 9px;

    overflow: hidden;
}

.title-icon {

    width: 34px;
    height: 34px;

    flex: 0 0 34px;

    display: grid;

    place-items: center;

    border-radius: 11px;

    color: #ff8fc7;

    background:
        rgba(255,105,180,.10);

    border:
        1px solid rgba(255,105,180,.16);

    font-size: 17px;

    box-shadow:
        0 0 20px rgba(255,105,180,.08);
}

.title-text {

    min-width: 0;

    overflow: hidden;
}

.title-name {

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size: 16px;

    line-height: 18px;

    font-weight: 700;

    letter-spacing: .2px;
}

.title-status {

    display: flex;

    align-items: center;

    gap: 5px;

    margin-top: 1px;

    color: rgba(255,255,255,.48);

    font-size: 10px;

    line-height: 12px;

    font-weight: 500;

    white-space: nowrap;
}

.status-dot {

    width: 6px;
    height: 6px;

    flex: 0 0 6px;

    border-radius: 50%;

    background: #7dffb2;

    box-shadow:
        0 0 10px rgba(125,255,178,.7);

    animation:
        pulse 2s infinite;
}


/* =========================================================
   AÇÕES DO CABEÇALHO
========================================================= */

.header-actions {

    flex: 0 0 auto;

    display: flex;

    align-items: center;

    gap: 6px;
}

.icon-button {

    width: 38px;
    height: 38px;

    flex: 0 0 38px;

    display: grid;

    place-items: center;

    padding: 0;

    border: 0;

    border-radius: 12px;

    color: rgba(255,255,255,.88);

    background:
        rgba(255,255,255,.055);

    outline: none;

    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.07);

    cursor: pointer;

    font-family: Arial, sans-serif;

    font-size: 17px;

    touch-action: manipulation;

    transition:
        transform .18s ease,
        background .18s ease,
        color .18s ease;
}

.icon-button:active {

    transform: scale(.92);

    background:
        rgba(255,255,255,.12);
}


/* =========================================================
   CONTROLES DO MAPA
========================================================= */

.map-controls {

    position: absolute;

    right: 14px;

    bottom: 14px;

    z-index: 1500;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 8px;

    pointer-events: none;

    animation:
        controlsIn .7s .2s ease both;
}

.map-button {

    width: 44px;
    height: 44px;

    flex: 0 0 44px;

    display: grid;

    place-items: center;

    padding: 0;

    border: 0;

    border-radius: 14px;

    color: #fff;

    background:
        rgba(10,10,13,.82);

    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.10),
        0 8px 25px rgba(0,0,0,.35);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    cursor: pointer;

    font-family: Arial, sans-serif;

    font-size: 20px;

    line-height: 1;

    outline: none;

    pointer-events: auto;

    touch-action: manipulation;

    transition:
        transform .15s ease,
        background .15s ease;
}

.map-button:active {

    transform: scale(.90);

    background:
        rgba(35,35,40,.95);
}


/* =========================================================
   LEAFLET
========================================================= */

.leaflet-container {

    width: 100%;
    height: 100%;

    background: #111;

    font-family: "Quicksand", Arial, sans-serif;

    outline: none;
}

.leaflet-control-zoom {

    display: none !important;
}

.leaflet-control-attribution {

    margin:
        0
        7px
        7px
        0 !important;

    padding:
        3px
        7px !important;

    border-radius: 8px;

    color:
        rgba(255,255,255,.55) !important;

    background:
        rgba(0,0,0,.58) !important;

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

    font-size: 9px !important;

    line-height: 12px !important;
}

.leaflet-control-attribution a {

    color:
        rgba(255,255,255,.75) !important;
}


/* =========================================================
   MARCADOR
========================================================= */

.custom-marker {

    position: relative;

    width: 18px;
    height: 18px;

    pointer-events: none;
}

.marker-core {

    position: absolute;

    top: 50%;
    left: 50%;

    width: 9px;
    height: 9px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #ff8fc7;

    border:
        2px solid #fff;

    box-shadow:
        0 0 15px rgba(255,105,180,.9);
}

.marker-ring {

    position: absolute;

    inset: 0;

    border-radius: 50%;

    border:
        1px solid rgba(255,143,199,.7);

    animation:
        markerPulse 2s infinite;
}


/* =========================================================
   LOCALIZAÇÃO DO USUÁRIO
========================================================= */

.user-location {

    width: 18px;
    height: 18px;

    border-radius: 50%;

    background: #6eb5ff;

    border:
        3px solid #fff;

    box-shadow:
        0 0 0 7px rgba(110,181,255,.18),
        0 0 25px rgba(110,181,255,.75);
}


/* =========================================================
   TOAST
========================================================= */

.toast {

    position: fixed;

    left: 50%;

    bottom:
        calc(
            max(16px, env(safe-area-inset-bottom)) + 16px
        );

    transform:
        translate(-50%, 20px);

    z-index: 9000;

    width: max-content;

    max-width:
        calc(100% - 40px);

    padding:
        11px
        16px;

    border-radius: 13px;

    color:
        rgba(255,255,255,.92);

    background:
        rgba(12,12,15,.90);

    border:
        1px solid rgba(255,255,255,.10);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    box-shadow:
        0 12px 35px rgba(0,0,0,.4);

    font-size: 12px;

    line-height: 16px;

    text-align: center;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.toast.show {

    opacity: 1;

    transform:
        translate(-50%, 0);
}


/* =========================================================
   ANIMAÇÕES
========================================================= */

@keyframes pageIn {

    from {
                opacity: 0;
                transform: translateY(0px);
            }

            to {
                opacity: 1;
                transform: translateY(15px);
            }
}

@keyframes mapIn {

    from {
        opacity: 0;
        transform: scale(.985);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes headerIn {

    from {
        opacity: 0;
        transform:
            translate(-50%, -12px);
    }

    to {
        opacity: 1;
        transform:
            translate(-50%, 0);
    }
}

@keyframes controlsIn {

    from {
        opacity: 0;
        transform:
            translateX(15px);
    }

    to {
        opacity: 1;
        transform:
            translateX(0);
    }
}

@keyframes pulse {

    0%,
    100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: .45;
        transform: scale(.75);
    }
}

@keyframes markerPulse {

    0% {
        opacity: .8;
        transform: scale(.65);
    }

    70% {
        opacity: 0;
        transform: scale(1.8);
    }

    100% {
        opacity: 0;
        transform: scale(1.8);
    }
}


/* =========================================================
   CELULAR
========================================================= */

@media (max-width: 600px) {

    .app {

        padding:
            max(6px, env(safe-area-inset-top))
            max(6px, env(safe-area-inset-right))
            max(6px, env(safe-area-inset-bottom))
            max(6px, env(safe-area-inset-left));
    }

    .header {

        width:
            calc(
                100% -
                max(12px, env(safe-area-inset-left)) -
                max(12px, env(safe-area-inset-right))
            );

        height: 52px;

        min-height: 52px;

        padding:
            6px
            7px
            6px
            11px;

        border-radius: 16px;
    }

    .map-wrapper {

        top:
            calc(
                max(6px, env(safe-area-inset-top)) + 60px
            );

        right:
            max(6px, env(safe-area-inset-right));

        bottom:
            max(6px, env(safe-area-inset-bottom));

        left:
            max(6px, env(safe-area-inset-left));

        border-radius: 19px;
    }

    .title {

        gap: 8px;
    }

    .title-icon {

        width: 32px;
        height: 32px;

        flex-basis: 32px;

        border-radius: 10px;

        font-size: 16px;
    }

    .title-name {

        font-size: 15px;

        line-height: 17px;
    }

    .title-status {

        font-size: 9px;

        line-height: 11px;
    }

    .icon-button {

        width: 36px;
        height: 36px;

        flex-basis: 36px;

        border-radius: 11px;

        font-size: 16px;
    }

    .map-controls {

        right: 11px;

        bottom: 11px;

        gap: 7px;
    }

    .map-button {

        width: 43px;
        height: 43px;

        flex-basis: 43px;

        border-radius: 13px;
    }

}


/* =========================================================
   TELAS MUITO PEQUENAS
========================================================= */

@media (max-width: 360px) {

    .header {

        padding-left: 9px;
    }

    .header-actions .icon-button:last-child {

        display: none;
    }

    .title-status {

        display: none;
    }

    .title-icon {

        width: 30px;
        height: 30px;

        flex-basis: 30px;
    }

    .map-wrapper {

        top:
            calc(
                max(6px, env(safe-area-inset-top)) + 58px
            );
    }

}


/* =========================================================
   ALTURA MUITO PEQUENA / LANDSCAPE
========================================================= */

@media (max-height: 500px) {

    .header {

        height: 46px;

        min-height: 46px;

        padding-top: 4px;
        padding-bottom: 4px;
    }

    .title-icon {

        width: 30px;
        height: 30px;

        flex-basis: 30px;
    }

    .icon-button {

        width: 34px;
        height: 34px;

        flex-basis: 34px;
    }

    .map-wrapper {

        top:
            calc(
                max(5px, env(safe-area-inset-top)) + 52px
            );
    }

    .map-button {

        width: 40px;
        height: 40px;

        flex-basis: 40px;
    }

}

svg {
width: 25px;
height: 25px;
}
</style>

</head>

<div class="app">

    <header class="header">

        <div class="title">

            <div class="title-icon">
<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M12 21C15.5 17.4 19 14.1764 19 10.2C19 6.22355 15.866 3 12 3C8.13401 3 5 6.22355 5 10.2C5 14.1764 8.5 17.4 12 21Z" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> <path d="M12 13C13.6569 13 15 11.6569 15 10C15 8.34315 13.6569 7 12 7C10.3431 7 9 8.34315 9 10C9 11.6569 10.3431 13 12 13Z" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg>
            </div>

            <div class="title-text">

                <div class="title-name">
                    Mapa
                </div>

                <div class="title-status">

                    <span class="status-dot"></span>

                    Mapa online

                </div>

            </div>

        </div>


        <div class="header-actions">

            <button
                class="icon-button"
                id="locateButton"

                title="Minha localização"

            >
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M3 8.70938C3 7.23584 3 6.49907 3.39264 6.06935C3.53204 5.91678 3.70147 5.79466 3.89029 5.71066C4.42213 5.47406 5.12109 5.70705 6.51901 6.17302C7.58626 6.52877 8.11989 6.70665 8.6591 6.68823C8.85714 6.68147 9.05401 6.65511 9.24685 6.60952C9.77191 6.48541 10.2399 6.1734 11.176 5.54937L12.5583 4.62778C13.7574 3.82843 14.3569 3.42876 15.0451 3.3366C15.7333 3.24444 16.4168 3.47229 17.7839 3.92799L18.9487 4.31624C19.9387 4.64625 20.4337 4.81126 20.7169 5.20409C21 5.59692 21 6.11871 21 7.16229V15.2907C21 16.7642 21 17.501 20.6074 17.9307C20.468 18.0833 20.2985 18.2054 20.1097 18.2894C19.5779 18.526 18.8789 18.293 17.481 17.827C16.4137 17.4713 15.8801 17.2934 15.3409 17.3118C15.1429 17.3186 14.946 17.3449 14.7532 17.3905C14.2281 17.5146 13.7601 17.8266 12.824 18.4507L11.4417 19.3722C10.2426 20.1716 9.64311 20.5713 8.95493 20.6634C8.26674 20.7556 7.58319 20.5277 6.21609 20.072L5.05132 19.6838C4.06129 19.3538 3.56627 19.1888 3.28314 18.7959C3 18.4031 3 17.8813 3 16.8377V8.70938Z" stroke="#ffffff" stroke-width="1.5"></path> <path d="M9 6.63867V20.5" stroke="#ffffff" stroke-width="1.5"></path> <path d="M15 3V17" stroke="#ffffff" stroke-width="1.5"></path> </g></svg>
            </button>

            <button

                type="button"
            >

            </button>

        </div>

    </header>


    <!-- =====================================================
         ÁREA DO MAPA
    ====================================================== -->

    <main class="map-wrapper">

        <div id="map"></div>


        <!-- =================================================
             CONTROLES
        ================================================== -->

        <div class="map-controls">

            <button

                id="zoomIn"

                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"></path> </g></svg>

        </div>

    </main>


    <!-- =====================================================

    <div

</div>


<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const CENTER = [-23.5505, -46.6333];

const DEFAULT_ZOOM = 12;


/* =========================================================
   MAPA
========================================================= */

const map = L.map("map", {

    zoomControl: false,

    attributionControl: true,

    preferCanvas: true,

    zoomAnimation: true,

    fadeAnimation: true,

    markerZoomAnimation: true,

    minZoom: 3,

    maxZoom: 19

}).setView(
    CENTER,
    DEFAULT_ZOOM
);


/* =========================================================
   MAPA BASE
========================================================= */

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {

        maxZoom: 19,

        minZoom: 3,

        updateWhenIdle: true,

        updateWhenZooming: false,

        keepBuffer: 2,

        attribution:
            "&copy; OpenStreetMap contributors"

    }
).addTo(map);


/* =========================================================
   MARCADOR CUSTOMIZADO
========================================================= */

const markerIcon = L.divIcon({

    className: "",

    html: `
        <div class="custom-marker">
            <div class="marker-ring"></div>
            <div class="marker-core"></div>
        </div>
    `,

    iconSize: [18, 18],

    iconAnchor: [9, 9]

});


/* =========================================================
   PONTOS
========================================================= */

const pontos = [

    [-23.5505, -46.6333],

    [-23.5600, -46.6200],

    [-23.5400, -46.6500]

];


const markers = [];


pontos.forEach(
    (position, index) => {

        const marker =
            L.marker(
                position,
                {
                    icon: markerIcon,
                    keyboard: false
                }
            )
            .addTo(map);


        marker.bindTooltip(
            `Ponto ${index + 1}`,
            {
                direction: "top",

                offset: [0, -10],

                opacity: .9
            }
        );


        markers.push(marker);

    }
);


/* =========================================================
   TOAST
========================================================= */

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );
}


/* =========================================================
   ZOOM
========================================================= */

document
    .getElementById("zoomIn")
    .addEventListener(
        "click",
        () => {

            map.zoomIn();

        }
    );


document
    .getElementById("zoomOut")
    .addEventListener(
        "click",
        () => {

            map.zoomOut();

        }
    );


/* =========================================================
   RESET
========================================================= */

function resetMap() {

    map.flyTo(
        CENTER,
        DEFAULT_ZOOM,
        {
            duration: .8
        }
    );

}


document
    .getElementById("resetButton")
    .addEventListener(
        "click",
        resetMap
    );


/* =========================================================
   LOCALIZAÇÃO
========================================================= */

let userMarker = null;

let userAccuracy = null;


function locateUser() {

    if (
        !navigator.geolocation
    ) {

        showToast(
            "A localização não está disponível neste dispositivo."
        );

        return;
    }


    showToast(
        "Obtendo sua localização..."
    );


    navigator.geolocation.getCurrentPosition(

        position => {

            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;


            const userIcon =
                L.divIcon({

                    className: "",

                    html:
                        `<div class="user-location"></div>`,

                    iconSize: [18, 18],

                    iconAnchor: [9, 9]

                });


            if (userMarker) {

                userMarker.setLatLng([
                    lat,
                    lng
                ]);

            } else {

                userMarker =
                    L.marker(
                        [lat, lng],
                        {
                            icon: userIcon,

                            zIndexOffset: 1000
                        }
                    )
                    .addTo(map);

            }


            if (userAccuracy) {

                map.removeLayer(
                    userAccuracy
                );

            }


            userAccuracy =
                L.circle(
                    [lat, lng],
                    {
                        radius: accuracy,

                        color: "#6eb5ff",

                        weight: 1,

                        opacity: .35,

                        fillColor: "#6eb5ff",

                        fillOpacity: .06
                    }
                )
                .addTo(map);


            map.flyTo(
                [lat, lng],
                Math.max(
                    map.getZoom(),
                    15
                ),
                {
                    duration: 1
                }
            );


            showToast(
                "Localização encontrada."
            );

        },


        error => {

            let message =
                "Não foi possível obter sua localização.";


            if (
                error.code === 1
            ) {

                message =
                    "Permissão de localização negada.";

            }


            if (
                error.code === 2
            ) {

                message =
                    "Localização indisponível.";

            }


            if (
                error.code === 3
            ) {

                message =
                    "Tempo limite da localização.";

            }


            showToast(message);

        },


        {

            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 30000

        }

    );

}


document
    .getElementById("locateButton")
    .addEventListener(
        "click",
        locateUser
    );


document
    .getElementById("myLocation")
    .addEventListener(
        "click",
        locateUser
    );


/* =========================================================
   DUPLO CLIQUE
========================================================= */

map.on(
    "dblclick",
    event => {

        map.flyTo(
            event.latlng,
            Math.min(
                map.getZoom() + 2,
                19
            ),
            {
                duration: .5
            }
        );

    }
);


/* =========================================================
   TECLADO
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "+" ||
            event.key === "="
        ) {

            map.zoomIn();

        }


        if (
            event.key === "-" ||
            event.key === "_"
        ) {

            map.zoomOut();

        }


        if (
            event.key === "Escape"
        ) {

            resetMap();

        }

    }
);


/* =========================================================
   WALLPAPER ANDROID
========================================================= */

window.addEventListener(
    "load",
    () => {

        let wall = "";


        try {

            if (
                typeof Android !== "undefined" &&
                typeof Android.getWallpaperUrl === "function"
            ) {

                wall =
                    Android.getWallpaperUrl();

            }

        } catch (error) {

            wall = "";

        }


        const background =
            document.getElementById(
                "background"
            );


        if (
            wall &&
            typeof wall === "string" &&
            wall.trim().length > 0
        ) {

            const safeWall =
                wall
                    .replace(/\\/g, "\\\\")
                    .replace(/"/g, '\\"');


            background.style.backgroundImage =
                `url("${safeWall}")`;

        }

    }
);


/* =========================================================
   INVALIDATE DO LEAFLET
========================================================= */

function refreshMapSize() {

    requestAnimationFrame(
        () => {

            map.invalidateSize({
                pan: false,
                animate: false
            });

        }
    );

}


/* =========================================================
   RESIZE NORMAL
========================================================= */

window.addEventListener(
    "resize",
    refreshMapSize
);


/* =========================================================
   ORIENTAÇÃO
========================================================= */

window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            refreshMapSize,
            250
        );

        setTimeout(
            refreshMapSize,
            600
        );

    }
);


/* =========================================================
   VISUAL VIEWPORT
   IMPORTANTE PARA ANDROID WEBVIEW
========================================================= */

if (
    window.visualViewport
) {

    window.visualViewport.addEventListener(
        "resize",
        refreshMapSize
    );

    window.visualViewport.addEventListener(
        "scroll",
        refreshMapSize
    );

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

window.addEventListener(
    "load",
    () => {

        setTimeout(
            refreshMapSize,
            50
        );

        setTimeout(
            refreshMapSize,
            250
        );

        setTimeout(
            refreshMapSize,
            600
        );

    }
);

</script>

</body>

</html>
