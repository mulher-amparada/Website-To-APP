<title>Controle</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    background: black;
}


.bottom {
    width: 60%;
    height: 80px;
    background: #444;
    border-radius: 200px;
    position: fixed;
    bottom: 7%;
    left: 50%;
    transform: translateX(-50%);
}

.knob {
    width: 100px;
    height: 70px;
    background: #333;
    border-radius: 200px;
    position: absolute;
    top: 5px;
    left: 5px;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: left 0.2s ease;
}

.icon-left,
.icon-right {
    width: 40px;
    height: 40px;
    fill: none;
    stroke: #ddd;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.icon-right {
    display: none;
}

/* MAIN */

.mainUI{

  width:100%;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:80px;

  padding:
  35px 18px 140px;
}

/* HERO */

.hero{
  width:100%;
  max-width:720px;

  margin-top:70px;

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;
}

.heroTag{

  display:inline-flex;

  padding:10px 18px;

  border-radius:999px;

  background:
  rgba(255,255,255,.06);

  border:
  1px solid rgba(255,255,255,.08);

  color:#ffb4da;

  font-size:13px;
  font-weight:700;

  letter-spacing:1px;

  text-transform:uppercase;

  margin-bottom:22px;
}

.heroTag1{

  display:inline-flex;

  padding:10px 18px;

  border-radius:999px;

  
  color:blue;

  font-size:20px;
  font-weight:700;

  letter-spacing:1px;

  text-transform:uppercase;

  margin-bottom:22px;

}

.hero h1{

  font-size:
  clamp(36px,8vw,64px);

  line-height:1.05;

  margin-bottom:18px;

  font-weight:800;
}

.hero p{

  color:var(--soft);

  line-height:1.7;

  font-size:16px;

  max-width:580px;

  margin:auto;
}

/* SECTION */

.section{

  width:100%;
  max-width:420px;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:20px;
}

.label{

  font-size:13px;

  text-transform:uppercase;

  letter-spacing:1.8px;

  color:#ffffff88;

  font-weight:700;
}

/* SOS */

.panic{

  width:100%;
  min-height:260px;

  border-radius:40px;

  background:
  linear-gradient(
    145deg,
    #ff1744,
    #ff4d6d
  );

  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;

  position:relative;

  overflow:hidden;

  box-shadow:
  0 20px 60px rgba(255,40,90,.35);

  transition:
  transform .15s,
  filter .15s;
}

.panic::before{

  content:"";

  position:absolute;

  width:260px;
  height:260px;

  border-radius:50%;

  background:
  rgba(255,255,255,.08);

  top:-120px;
  right:-90px;
}

.panic span{

  font-size:68px;

  font-weight:800;

  letter-spacing:3px;
}

.panic small{

  margin-top:10px;

  font-size:15px;

  color:#ffffffd5;
}

.panic:active{

  transform:scale(.97);

  filter:brightness(1.08);
}

/* PALMA */

.palma{

  width:100%;

  border-radius:40px;

  background:
  linear-gradient(
    180deg,
    #ff4fa3,
    #ff2f92
  );

  padding:36px 24px;

  text-align:center;

  position:relative;

  overflow:hidden;

  box-shadow:
  0 18px 45px rgba(255,79,163,.32);
}

.palma::before{

  content:"";

  position:absolute;

  width:240px;
  height:240px;

  border-radius:50%;

  background:
  rgba(255,255,255,.06);

  top:-120px;
  right:-90px;
}

.palma-icon{

  font-size:70px;

  margin-bottom:18px;

  animation:palma .9s infinite;
}

@keyframes palma{

  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.12);
  }

  100%{
    transform:scale(1);
  }
}

.palma h3{

  font-size:30px;

  margin-bottom:14px;
}

.palma p{

  line-height:1.7;

  color:#ffffffde;

  margin-bottom:28px;
}

/* BUTTONS */

.btn,
.local,
.btn1,
.palma button{

  width:100%;

  min-height:58px;

  border:none;

  border-radius:999px;

  font-size:16px;
  font-weight:700;

  color:white;

  cursor:pointer;

  transition:
  transform .15s,
  opacity .15s,
  filter .15s;
}

.btn:active,
.local:active,
.btn1:active,
.palma button:active{

  transform:scale(.97);
}

#ativarPalmas{

  background:white;

  color:#ff2f92;
}

#desativarPalmas{

  margin-top:14px;

  background:#ff8cc4;
}

/* PROTEÇÃO */

  padding:30px 24px;

  border-radius:32px;

  text-align:center;

  font-size:20px;
  font-weight:700;

  line-height:1.6;

  cursor:pointer;

  transition:.25s;
}

.ativo{

  background:#2b103d;

  color:#d88cff;

  2px solid #b84dff;

  0 10px 35px rgba(184,77,255,.25);

.desativado{

  color:#9b9b9b;

  border:
  2px solid #303030;

<script>
const controle = document.getElementById("controle");
const knob = document.getElementById("knob");
const leftIcon = document.getElementById("leftIcon");
const rightIcon = document.getElementById("rightIcon");

let ladoAtual = "esquerda";

controle.addEventListener("click", (e) => {
    const metade = controle.offsetWidth / 2;

    if (e.offsetX < metade) {

        knob.style.left = "5px";

        leftIcon.style.display = "block";
        rightIcon.style.display = "none";

        ladoAtual = "esquerda";

    } else {

        knob.style.left =
            (controle.offsetWidth - knob.offsetWidth - 5) + "px";

        leftIcon.style.display = "none";
        rightIcon.style.display = "block";

        if (ladoAtual === "esquerda") {
            setTimeout(() => {
                window.location.href = "index3.html";
            }, 250);
        }

        ladoAtual = "direita";
    }
});
</script>

<script>


const panic = document.querySelector(".panic");

/* SOS */

panic.addEventListener(
"click",
ativarSOS
);

function ativarSOS(){

  navigator.vibrate?.(300);

  panic.style.transform =
  "scale(.96)";

  setTimeout(()=>{

    panic.style.transform =
    "scale(1)";

  },120);

  if(
    window.Android &&
    Android.ligarDireto
  ){

    try{

      Android.ligarDireto("180");

      return;

    }catch(e){

      console.log(e);
    }
  }

  try{

    window.location.href =
    "tel:180";

  }catch(e){

    alert(
      "Não foi possível iniciar ligação"
    );
  }
}

/* FUNÇÕES */

function ligar(numero){

  window.location.href =
  "tel:" + numero;
}

function whatsapp180(){

  window.location.href =
  "https://wa.me/556196100180";
}

function enviarLocalizacao(){

  if(!navigator.geolocation){

    alert(
      "Geolocalização não suportada"
    );

    return;
  }

  navigator.geolocation
  .getCurrentPosition(

    function(pos){

      const link =
      `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;

      window.location.href =
      "https://wa.me/556196100180?text=" +
      encodeURIComponent(
        "🚨 SOCORRO! Estou aqui: " + link
      );
    },

    function(){

      alert(
        "Não foi possível obter localização"
      );
    }
  );
}

/* BIOMETRIA */


const ativar =
document.getElementById(
"ativarPalmas"
);

const desativar =
document.getElementById(
"desativarPalmas"
);

ativar.onclick = ()=>{

  Android.ativarPalmas();

  ativar.innerText =
  "Proteção ativada";
};

desativar.onclick = ()=>{

  Android.desativarPalmas();

  ativar.innerText =
  "Ativar proteção";
};

const protecao =
document.getElementById(
"protecao"
);

let ativa = false;

protecao.onclick = function(){

  ativa = !ativa;

  if(ativa){

    protecao.classList
    .remove("desativado");

    protecao.classList
    .add("ativo");

    protecao.innerHTML =

    ` Balançar o celular
    para pedir ajuda

    <br><br>

    ATIVADO`;

    if(
      window.Android &&
      Android.ativarProtecao
    ){

      Android.ativarProtecao();
    }

  } else {

    protecao.classList
    .remove("ativo");

    protecao.classList
    .add("desativado");

    protecao.innerHTML =

    ` Balançar o celular
    para pedir ajuda

    <br><br>

    DESATIVADO`;

    if(
      window.Android &&
      Android.desativarProtecao
    ){

      Android.desativarProtecao();
    }
  }
}

/* PALMAS */

</script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const btnBrilho = document.getElementById("brilho");

    btnBrilho.classList.add("local99");

    btnBrilho.innerHTML =
        "Escurecimento por inclinação<br><br>DESATIVADO";

    btnBrilho.addEventListener("click", () => {

        if (btnBrilho.classList.contains("local999")) {

            btnBrilho.classList.remove("local999");
            btnBrilho.classList.add("local99");

            btnBrilho.innerHTML =
                "Escurecimento por inclinação<br><br>DESATIVADO";

            if (typeof TiltBrightness !== "undefined" &&
                typeof TiltBrightness.stopTiltBrightness === "function") {
                TiltBrightness.stopTiltBrightness();
            }

            return;
        }

        btnBrilho.classList.remove("local99");
        btnBrilho.classList.add("local999");

        if (typeof TiltBrightness !== "undefined" &&
            typeof TiltBrightness.startTiltBrightness === "function") {
            TiltBrightness.startTiltBrightness();
        }

        btnBrilho.innerHTML =
            "Escurecimento por inclinação<br><br>ATIVADO";
    });

    window.addEventListener("tiltbrightness", e => {

        if (e.detail === "dark") {

            btnBrilho.classList.remove("local99");
            btnBrilho.classList.add("local999");

            btnBrilho.innerHTML =
                "Escurecimento por inclinação<br><br>ATIVADO";
        }
    });

});
</script>
