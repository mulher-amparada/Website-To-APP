<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle</title>

<style>
@font-face {
    font-family: "Quicksand";
    src: url("font.ttf") format("truetype");
    font-weight: 400 800;
}

:root {
    --bg: #07080c;
    --surface: #101218;
    --surface-2: #151720;
    --surface-3: #1b1e28;

    --white: #fff;
    --text: #f7f7fa;
    --soft: #969baa;
    --muted: #626877;

    --pink: #ff3f82;
    --pink-light: #ff6b9f;

    --red: #ff4054;
    --red-dark: #d9273d;

    --purple: #8b5cf6;
    --blue: #4f8cff;
    --green: #32d477;
    --orange: #ff9f43;
    --cyan: #27c9c1;

    --border: rgba(255,255,255,.075);
    --border-strong: rgba(255,255,255,.13);

    --radius: 24px;
    --radius-small: 17px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    font-family: "Quicksand", sans-serif;
    font-weight: 700;

    -webkit-tap-highlight-color: transparent;
}

html {
    width: 100%;
    min-height: 100%;

    background: black;

    scroll-behavior: smooth;
}

body {
    width: 100%;
    min-height: 100vh;
margin-top: 5%;
    overflow-x: hidden;

    background: black;

    color: var(--text);
}

/* =====================================================
   ANIMAÇÕES
   ===================================================== */

@keyframes pageIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes sosGlow {
    0%, 100% {
        box-shadow:
            0 18px 50px rgba(255,64,84,.18),
            0 0 0 0 rgba(255,64,84,0);
    }

    50% {
        box-shadow:
            0 18px 55px rgba(255,64,84,.27),
            0 0 0 9px rgba(255,64,84,.035);
    }
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }
}

@keyframes statusPulse {
    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: .45;
    }
}

@keyframes floatingPill {
    0% {
        opacity: 0;
        transform: translate3d(0, 12px, 0);
    }

    100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
    }
}

/* =====================================================
   LAYOUT
   ===================================================== */

.mainUI {
    width: 100%;
    max-width: 680px;

    margin: auto;

    padding:
        24px
        18px
        125px;

    display: flex;
    flex-direction: column;

    gap: 34px;

    animation: pageIn .5s ease;
}

/* =====================================================
   HEADER
   ===================================================== */

.hero {
    width: 100%;

    margin-top: 3px;

    display: flex;
    flex-direction: column;

    position: relative;
}

.heroTag {
    width: fit-content;

    display: flex;
    align-items: center;

    gap: 8px;

    margin-bottom: 13px;

    padding: 7px 11px;

    border-radius: 200px;

    color: #ff78a8;

    background:
        rgba(255,63,130,.08);

    border:
        1px solid rgba(255,63,130,.13);

    font-size: 11px;

    letter-spacing: 1.3px;

    text-transform: uppercase;
}

.heroTag::before {
    content: "";

    width: 6px;
    height: 6px;

    flex-shrink: 0;

    border-radius: 50%;

    background: var(--pink);

    box-shadow:
        0 0 10px rgba(255,63,130,.85);
}

.hero h1 {
    color: var(--white);

    font-size:
        clamp(36px, 9vw, 54px);

    line-height: .98;

    letter-spacing: -1.8px;
}

.hero p {
    margin-top: 13px;

    color: var(--soft);

    font-size: 14px;

    line-height: 1.65;
}

/* =====================================================
   SEÇÕES
   ===================================================== */

.section {
    width: 100%;

    display: flex;
    flex-direction: column;

    gap: 11px;

    animation:
        pageIn .5s ease both;
}

.section:nth-of-type(1) {
    animation-delay: .04s;
}

.section:nth-of-type(2) {
    animation-delay: .08s;
}

.section:nth-of-type(3) {
    animation-delay: .12s;
}

.section:nth-of-type(4) {
    animation-delay: .16s;
}

.section:nth-of-type(5) {
    animation-delay: .20s;
}

.section:nth-of-type(6) {
    animation-delay: .24s;
}

.label {
    display: flex;
    align-items: center;

    gap: 8px;

    padding-left: 3px;

    color: var(--muted);

    font-size: 10px;

    letter-spacing: 1.8px;

    text-transform: uppercase;
}

.label::before {
    content: "";

    width: 4px;
    height: 4px;

    flex-shrink: 0;

    border-radius: 50%;

    background: var(--pink);

    box-shadow:
        0 0 8px rgba(255,63,130,.5);
}

/* =====================================================
   SOS
   ===================================================== */

.panic {
    width: 100%;
    height: 300px;

    position: relative;

    overflow: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    border-radius: 30px;

    cursor: pointer;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,255,255,.15),
            transparent 40%
        ),
        linear-gradient(
            145deg,
            #ff465a,
            #e92d43
        );

    border:
        1px solid rgba(255,255,255,.10);

    animation:
        sosGlow 3s ease-in-out infinite;

    transition:
        transform .15s ease,
        filter .15s ease;
}

.panic::before {
    content: "";

    position: absolute;

    width: 370px;
    height: 370px;

    top: -245px;
    right: -135px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.075);
}



.panic span {
    position: relative;

    z-index: 2;

    color: white;

    font-size:
        clamp(62px, 17vw, 88px);

    line-height: .9;

    letter-spacing: 5px;

    text-shadow:
        0 5px 20px rgba(0,0,0,.17);
}

.panic small {
    position: relative;

    z-index: 2;

    margin-top: 17px;

    color: rgba(255,255,255,.78);

    font-size: 12px;

    letter-spacing: .5px;
}

.panic:active {
    transform: scale(.965);

    filter: brightness(1.08);
}

/* =====================================================
   CARTÃO DE SOM
   ===================================================== */

.palma {
    width: 100%;

    padding: 24px;

    position: relative;

    overflow: hidden;

    border-radius: var(--radius);

    background:
        linear-gradient(
            145deg,
            #161820,
            #0f1117
        );

    border:
        1px solid var(--border);

    box-shadow:
        0 16px 40px rgba(0,0,0,.25);
}

.palma::before {
    content: "";

    position: absolute;

    width: 240px;
    height: 240px;

    top: -160px;
    right: -90px;

    border-radius: 50%;

    background:
        rgba(255,63,130,.065);
}

.palma-icon {
    width: 50px;
    height: 50px;

    margin-bottom: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 16px;

    background:
        rgba(255,63,130,.09);

    color: var(--pink);

    font-size: 25px;

    animation:
        pulse 1.8s ease-in-out infinite;
}

.palma h3 {
    color: white;

    font-size: 22px;

    line-height: 1.15;

    margin-bottom: 9px;
}

.palma p {
    max-width: 500px;

    margin-bottom: 21px;

    color: var(--soft);

    font-size: 13px;

    line-height: 1.65;
}

/* =====================================================
   BOTÕES
   ===================================================== */

.btn,
.local,
.btn1,
.palma button {
    width: 100%;
    min-height: 56px;

    padding: 14px 17px;

    border: 0;
    border-radius: 160px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    font-family: "Quicksand", sans-serif;
    font-size: 14px;
    font-weight: 700;

    cursor: pointer;

    transition:
        transform .14s ease,
        filter .14s ease,
        box-shadow .2s ease;
}

.btn:active,
.local:active,
.btn1:active,
.palma button:active {
    transform: scale(.965);

    filter: brightness(1.08);
}

/* =====================================================
   EMERGÊNCIA
   ===================================================== */

.policia {
    background:
        linear-gradient(135deg, #4d8cff, #326ed8);

    box-shadow:
        0 9px 24px rgba(77,140,255,.12);
}

.samu {
    background:
        linear-gradient(135deg, #ffa94d, #df7d19);

    box-shadow:
        0 9px 24px rgba(255,169,77,.10);
}

.mulher {
    background:
        linear-gradient(135deg, #ff4e90, #dc2f6d);

    box-shadow:
        0 9px 24px rgba(255,78,144,.11);
}

.zap {
    background:
        linear-gradient(135deg, #35d477, #20af5b);

    box-shadow:
        0 9px 24px rgba(53,212,119,.10);
}

/* =====================================================
   PROTEÇÃO POR SOM
   ===================================================== */

#ativarPalmas {
    background:
        linear-gradient(
            135deg,
            var(--pink),
            #e52e70
        );

    box-shadow:
        0 9px 25px rgba(255,63,130,.15);
}

#desativarPalmas {
    margin-top: 9px;

    color: #8d93a1;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid var(--border);
}

/* =====================================================
   MOVIMENTO
   ===================================================== */

#protecao {
    width: 100%;
    min-height: 140px;

    padding: 25px;

    position: relative;

    overflow: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    border-radius: var(--radius);

    text-align: center;

    font-size: 14px;

    line-height: 1.55;

    cursor: pointer;

    transition:
        background .25s ease,
        border .25s ease,
        box-shadow .25s ease,
        color .25s ease,
        transform .15s ease;
}

#protecao:active {
    transform: scale(.98);
}

.desativado {
    color: #777d8b;

    background:
        linear-gradient(
            145deg,
            #11131a,
            #0d0f14
        );

    border:
        1px solid var(--border);
}

.ativo {
    color: #c9adff;

    background:
        linear-gradient(
            145deg,
            #211636,
            #151021
        );

    border:
        1px solid rgba(139,92,246,.42);

    box-shadow:
        0 15px 40px rgba(139,92,246,.12);
}

.ativo::after {
    content: "";

    position: absolute;

    width: 8px;
    height: 8px;

    top: 18px;
    right: 18px;

    border-radius: 50%;

    background: #a878ff;

    box-shadow:
        0 0 12px rgba(168,120,255,.8);

    animation:
        statusPulse 1.5s infinite;
}

/* =====================================================
   BRILHO
   ===================================================== */

.local99,
.local999 {
    width: 100%;
    min-height: 92px;

    padding: 20px;

    border-radius: var(--radius-small);

    font-size: 14px;

    line-height: 1.5;

    text-align: center;

    cursor: pointer;

    transition:
        .25s ease;
}

.local99 {
    color: #858c9b;

    background:
        linear-gradient(
            145deg,
            #11131a,
            #0d0f14
        );

    border:
        1px solid var(--border);
}

.local999 {
    color: var(--orange);

    background:
        linear-gradient(
            145deg,
            #211b0e,
            #15120c
        );

    border:
        1px solid rgba(255,159,67,.38);

    box-shadow:
        0 12px 35px rgba(255,159,67,.07);
}

/* =====================================================
   LOCALIZAÇÃO
   ===================================================== */

.local {
    background:
        linear-gradient(
            135deg,
            #26c8c1,
            #14958f
        );

    box-shadow:
        0 9px 25px rgba(39,201,193,.10);
}

/* =====================================================
   CONTATOS
   ===================================================== */

.btn[onclick="selecionarContato()"] {
    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #6f42d8
        );

    box-shadow:
        0 9px 25px rgba(139,92,246,.11);
}

.btn[onclick="enviarSOSContatos()"] {
    background:
        linear-gradient(
            135deg,
            #ed3d55,
            #bd253b
        );

    box-shadow:
        0 9px 25px rgba(237,61,85,.11);
}
/* =========================================
   PÍRULA
   ========================================= */

.pirula {
    position: fixed;
margin-top: 8%;
    z-index: 999999;

    top: 24px;
    right: 24px;

    width: 70px;
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    border-radius: 50%;

    background: #444;

    border: 1px solid rgba(255,255,255,.15);

    box-shadow:
        0 10px 30px rgba(0,0,0,.35);

    overflow: hidden;

    cursor: pointer;

    animation:
        floatingPill 4s ease-in-out infinite;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;
}


/* =========================================
   ÍCONE — SEMPRE CENTRALIZADO
   ========================================= */

.pirula .icon {
    width: 56px;
    height: 56px;

    flex-shrink: 0;

    border-radius: 50%;

    background-image:
        url("user1.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    border:
        2px solid rgba(255,255,255,.18);

    box-shadow:
        0 4px 15px rgba(0,0,0,.35),
        0 0 18px rgba(255,192,203,.15);

    pointer-events: none;
}


/* =========================================
   TOQUE
   ========================================= */

.pirula:active {
    transform: scale(.92);

    filter: brightness(1.15);

    box-shadow:
        0 6px 20px rgba(0,0,0,.4),
        0 0 25px rgba(255,192,203,.2);
}


/* =========================================
   CELULARES PEQUENOS
   ========================================= */

@media (max-width: 420px) {

    .pirula {
        top: 16px;
        right: 16px;

        width: 64px;
        height: 64px;
    }

    .pirula .icon {
        width: 52px;
        height: 52px;
    }
}
/* =====================================================
   SELEÇÃO
   ===================================================== */

::selection {
    color: white;

    background:
        rgba(255,63,130,.35);
}

/* =====================================================
   TOUCH / ACESSIBILIDADE
   ===================================================== */

button,
.panic,
#protecao {
    user-select: none;
    -webkit-user-select: none;

    touch-action: manipulation;
}

button:focus-visible,
.panic:focus-visible,
#protecao:focus-visible {
    outline:
        2px solid rgba(255,63,130,.7);

    outline-offset: 3px;
}

/* =====================================================
   CELULARES PEQUENOS
   ===================================================== */

@media (max-width: 420px) {

    .mainUI {
        padding:
            20px
            14px
            110px;

        gap: 30px;
    }

    .hero h1 {
        font-size: 34px;
    }

    .panic {
        height: 245px;

        border-radius: 26px;
    }

    .panic span {
        font-size: 60px;
    }

    .palma {
        padding: 21px;
    }

    .pirula {
        top: 16px;
        right: 16px;

        width: 64px;
        height: 64px;
    }

    .pirula .icon {
        width: 48px;
        height: 48px;

        top: 8px;
        left: 8px;
    }

    .pirula.active {
        top: 12px;
        right: 12px;

        width: calc(100vw - 24px);
        height: calc(100vh - 24px);

        padding: 20px;

        border-radius: 26px;
    }

    .pirula.active .icon {
        width: 60px;
        height: 60px;

        top: 18px;
        left: 18px;
    }

    .menu {
        margin-top: 78px;
    }
}

/* =====================================================
   TELAS MAIORES
   ===================================================== */

@media (min-width: 600px) {

    .mainUI {
        padding-left: 28px;
        padding-right: 28px;
    }

    .hero,
    .section {
        max-width: 620px;
    }
}

.local999 {
    position: relative;
}

.local999::after {
    content: "";

    position: absolute;

    width: 8px;
    height: 8px;

    top: 18px;
    right: 18px;

    border-radius: 50%;

    background: var(--orange);

    box-shadow:
        0 0 12px rgba(255,159,67,.8);

    animation:
        statusPulse 1.5s infinite;
}
</style>
</head>
<body>

<div class="pirula" onclick="window.location.href='index3.html'">
    <div class="icon"></div>
</div>

<div class="mainUI">


    <!-- PAINEL FLUTUANTE -->


    <div class="hero">

        <div class="heroTag">
            Mulher Amparada
        </div>

    </div>


    <section class="section">

        <div class="label">
            Emergência
        </div>

        <div class="panic">

            <span>SOS</span>

            <small>
                toque para pedir ajuda
            </small>

        </div>

    </section>


    <section class="section">

        <div class="label">
            Barulho alto
        </div>

        <div class="palma">

            <div class="palma-icon"></div>

            <h3>
                Proteção por som
            </h3>

            <p>
                Ative ajuda automática ao detectar
                sons altos e situações suspeitas.
            </p>

            <button id="ativarPalmas">
                Ativar proteção
            </button>

            <button id="desativarPalmas">
                Desativar
            </button>

        </div>

    </section>


    <section class="section">

        <div class="label">
            Movimento
        </div>

        <div id="protecao" class="desativado">

            Balançar o celular
            para pedir ajuda

            <br><br>

            DESATIVADO

        </div>

    </section>


    <section class="section">

        <div class="label">
            Ajuda rápida
        </div>

        <button class="btn policia" onclick="ligar('190')">
            Polícia (190)
        </button>

        <button class="btn samu" onclick="ligar('192')">
            SAMU (192)
        </button>

        <button class="btn mulher" onclick="ligar('180')">
            Central da Mulher (180)
        </button>

        <button class="btn zap" onclick="whatsapp180()">
            WhatsApp 180
        </button>

    </section>


    <section class="section">

        <div class="label">
            Brilho
        </div>

        <button class="local99" id="brilho">
            Escurecer a tela
            <br><br>
            DESATIVADO
        </button>

    </section>


    <section class="section">

        <div class="label">
            Localização
        </div>

        <button onclick="enviarLocalizacao()" class="local">
            Enviar localização
        </button>

    </section>


    <section class="section">

        <div class="label">
            Contatos de confiança
        </div>

        <button
            class="btn"
            style="background:#8a2be2;"
            onclick="selecionarContato()">

            Adicionar contato

        </button>

        <button
            class="btn"
            style="background:#dc143c;"
            onclick="enviarSOSContatos()">

            SOS contatos

        </button>

    </section>

</div>



<script>


const panic = document.querySelector(".panic");

/* SOS */

panic.addEventListener(
"click",
ativarSOS
);

function ativarSOS(){

  navigator.vibrate?.(300);

  panic.style.transform =
  "scale(.96)";

  setTimeout(()=>{

    panic.style.transform =
    "scale(1)";

  },120);

  if(
    window.Android &&
    Android.ligarDireto
  ){

    try{

      Android.ligarDireto("180");

      return;

    }catch(e){

      console.log(e);
    }
  }

  try{

    window.location.href =
    "tel:180";

  }catch(e){

    alert(
      "Não foi possível iniciar ligação"
    );
  }
}

/* FUNÇÕES */

function ligar(numero){

  window.location.href =
  "tel:" + numero;
}

function whatsapp180(){

  window.location.href =
  "https://wa.me/556196100180";
}

function enviarLocalizacao(){

  if(!navigator.geolocation){

    alert(
      "Geolocalização não suportada"
    );

    return;
  }

  navigator.geolocation
  .getCurrentPosition(

    function(pos){

      const link =
      `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;

      window.location.href =
      "https://wa.me/556196100180?text=" +
      encodeURIComponent(
        "🚨 SOCORRO! Estou aqui: " + link
      );
    },

    function(){

      alert(
        "Não foi possível obter localização"
      );
    }
  );
}

/* BIOMETRIA */


const ativar =
document.getElementById(
"ativarPalmas"
);

const desativar =
document.getElementById(
"desativarPalmas"
);

ativar.onclick = ()=>{

  Android.ativarPalmas();

  ativar.innerText =
  "Proteção ativada";
};

desativar.onclick = ()=>{

  Android.desativarPalmas();

  ativar.innerText =
  "Ativar proteção";
};

const protecao =
document.getElementById(
"protecao"
);

let ativa = false;

protecao.onclick = function(){

  ativa = !ativa;

  if(ativa){

    protecao.classList
    .remove("desativado");

    protecao.classList
    .add("ativo");

    protecao.innerHTML =

    ` Balançar o celular
    para pedir ajuda

    <br><br>

    ATIVADO`;

    if(
      window.Android &&
      Android.ativarProtecao
    ){

      Android.ativarProtecao();
    }

  } else {

    protecao.classList
    .remove("ativo");

    protecao.classList
    .add("desativado");

    protecao.innerHTML =

    ` Balançar o celular
    para pedir ajuda

    <br><br>

    DESATIVADO`;

    if(
      window.Android &&
      Android.desativarProtecao
    ){

      Android.desativarProtecao();
    }
  }
}

/* PALMAS */

</script>


<script>



/* CONTATOS */


function ligar(numero){

  window.location.href =
  "tel:" + numero;
}

function enviarLocalizacao(){

  if(!navigator.geolocation){

    alert(
      "Geolocalização não suportada"
    );

    return;
  }

  navigator.geolocation
  .getCurrentPosition(

    function(pos){

      const link =
      `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;

      window.location.href =
      "https://wa.me/556196100180?text=" +
      encodeURIComponent(
        "🚨 SOCORRO! Estou aqui: " + link
      );
    },

    function(){

      alert(
        "Não foi possível obter localização"
      );
    }
  );
}

<script>
document.addEventListener("DOMContentLoaded", () => {

    const btnBrilho = document.getElementById("brilho");

    btnBrilho.classList.add("local99");

    btnBrilho.innerHTML =
        "Escurecimento por inclinação<br><br>DESATIVADO";

    btnBrilho.addEventListener("click", () => {

        if (btnBrilho.classList.contains("local999")) {

            btnBrilho.classList.remove("local999");
            btnBrilho.classList.add("local99");

            btnBrilho.innerHTML =
                "Escurecimento por inclinação<br><br>DESATIVADO";

            if (typeof TiltBrightness !== "undefined" &&
                typeof TiltBrightness.stopTiltBrightness === "function") {
                TiltBrightness.stopTiltBrightness();
            }

            return;
        }

        btnBrilho.classList.remove("local99");
        btnBrilho.classList.add("local999");

        if (typeof TiltBrightness !== "undefined" &&
            typeof TiltBrightness.startTiltBrightness === "function") {
            TiltBrightness.startTiltBrightness();
        }

        btnBrilho.innerHTML =
            "Escurecimento por inclinação<br><br>ATIVADO";
    });

    window.addEventListener("tiltbrightness", e => {

        if (e.detail === "dark") {

            btnBrilho.classList.remove("local99");
            btnBrilho.classList.add("local999");

            btnBrilho.innerHTML =
                "Escurecimento por inclinação<br><br>ATIVADO";
        }
    });

});
</script>

<script>

const pirula = document.getElementById("pirula");
const overlay = document.getElementById("pirulaOverlay");

let pirulaAberta = false;


/* =========================================
   ABRIR / FECHAR
   ========================================= */

function abrirPirula() {

    pirula.classList.add("active");

    pirulaAberta = true;

    document.body.classList.add("pirulaAberta");
}


function fecharPirula() {

    pirula.classList.remove("active");

    pirulaAberta = false;

    document.body.classList.remove("pirulaAberta");
}


function alternarPirula() {

    if (pirulaAberta) {

        fecharPirula();

    } else {

        abrirPirula();

    }
}


/* =========================================
   CLIQUE NA PÍRULA
   ========================================= */

pirula.addEventListener("click", function(e) {

    /*
     * Se clicou em um botão,
     * deixa o botão executar sua função.
     */
    if (e.target.closest(".menu button")) {
        return;
    }

    /*
     * Se clicou no ícone,
     * abre/fecha.
     */
    if (e.target.closest(".icon")) {

        alternarPirula();

    }

});


/* =========================================
   CLIQUE NO FUNDO
   ========================================= */

overlay.addEventListener("click", function() {

    fecharPirula();

});


/* =========================================
   BOTÃO VOLTAR DO ANDROID
   ========================================= */

document.addEventListener("backbutton", function() {

    if (pirulaAberta) {

        fecharPirula();

    }

});

   EXEMPLOS DOS BOTÕES
   ========================================= */
