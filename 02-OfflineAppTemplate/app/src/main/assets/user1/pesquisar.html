<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Apps</title>

<style>

.fundo{
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    z-index: -1;
}

#pesquisa {
position: relative;
left: 5%;
}

#micro {
position: relative;
right: 5%;
}

@font-face{
    font-family:Quicksand;
    src:url("font.ttf") format("truetype");
    font-weight:400;
}



*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Quicksand,sans-serif;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:transparent;
    color:#fff;
    overflow-x:hidden;
    
    
}

main{
    width:100%;
    
    height:100vh;
    padding:26px 18px 120px;
    
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:28px 12px;
 margin-top: 20px;
 overflow-y: scroll;
 height: 90%;
 border-radius: 30px;
}

.app{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.icon{
    width:68px;
    height:68px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.icon img,
.icon svg{
    width:67px;
    height:67px;
    
}

.name{
    margin-top:8px;
    font-size:13px;
    font-weight:600;
    line-height:1.2;
    max-width:72px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.pages{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-top:18px;
}

.pages span{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#555;
}

.pages span.active{
    background:#fff;
}


.search{
    position:fixed;
    left:50%;
    bottom:60px;
    transform:translateX(-50%);
    width:65%;
    max-width:430px;
    height:58px;
    border-radius:120px;
    background:#ff9999;
    display:flex;
    align-items:center;
    padding:0 20px;
    color:#8c8c8c;
    font-size:17px;
    font-weight:600;
    gap: 20px;
}

.search input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:white;
    font-size:16px;
    font-family:Quicksand,sans-serif;
    max-width: 100%;
}

.search input::placeholder{
    color:#ffffffaa;
}

@media screen and (orientation: landscape) {
.search{
width: 30%;
}
}

.search svg{
    width:30px;
    height:30px;
    display: flex;
    flex-direction: space-between;    
    
}

@media (max-width:360px){
    .grid{
        gap:22px 8px;
    }

    .icon,
    .icon img,
    .icon svg{
        width:60px;
        height:60px;
    }

    .name{
        font-size:12px;
    }
}
</style>
</head>

<body>

<div class="fundo"></div>

<main>

<div class="grid">

<!-- Coloque aqui seus aplicativos -->



</main>

<br><br>

<div class="search">


<input id="pesquisaInput" type="text" placeholder="Pesquisar">

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const grid = document.querySelector(".grid");
    const pesquisa = document.getElementById("pesquisaInput");

    let apps = JSON.parse(Android.obterApps());

    apps.sort((a, b) =>
        a.nome.localeCompare(
            b.nome,
            "pt-BR",
            { sensitivity: "base" }
        )
    );

    function renderizar(lista) {

        grid.innerHTML = "";

        const fragment = document.createDocumentFragment();

        lista.forEach(app => {

            const div = document.createElement("div");
            div.className = "app";

            div.addEventListener("click", () => {
                Android.abrirApp(app.pacote);
            });

            div.innerHTML = `
                <div class="icon">
                    <img src="${app.icone}" alt="${app.nome}">
                </div>

                <div class="name">
                    ${app.nome}
                </div>
            `;

            fragment.appendChild(div);
        });

        grid.appendChild(fragment);
    }

    renderizar(apps);

    pesquisa.addEventListener("input", () => {

        const termo = pesquisa.value
            .toLowerCase()
            .trim();

        const filtrados = apps.filter(app =>
            app.nome.toLowerCase().includes(termo)
        );

        renderizar(filtrados);
    });

});
</script>

</body>
</html>
