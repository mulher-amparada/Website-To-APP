<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Meus Acessos</title>

<style>
@keyframes fade{
    from{
        opacity:0;
        transform:translateY(18px) scale(.98);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes iconGlow{
    0%,100%{
        box-shadow:
            0 8px 25px rgba(123,104,238,.20);
    }
    50%{
        box-shadow:
            0 10px 32px rgba(123,104,238,.38);
    }
}

@keyframes shine{
    from{
        transform:translateX(-120%);
    }
    to{
        transform:translateX(120%);
    }
}

@font-face{
    font-family:"Quicksand";
    src:url("file:///android_asset/font.ttf") format("truetype");
    font-weight:400 800;
}

:root{
    --bg:#050507;

    --card:#0c0c10;
    --card2:#111117;

    --button:#111116;
    --button-hover:#18181f;

    --border:rgba(255,255,255,.075);
    --border-hover:rgba(139,124,255,.55);

    --primary:#8b7cff;
    --primary-light:#a99fff;

    --text:#fff;
    --text-soft:#a8a8b5;
    --text-muted:#696974;

    --radius:24px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:"Quicksand",sans-serif;

    -webkit-tap-highlight-color:transparent;
}

html{
    min-height:100%;
    scroll-behavior:smooth;
    background:var(--bg);
}

body{
    min-height:100vh;

    color:var(--text);

    background:
        radial-gradient(
            circle at 50% -15%,
            rgba(139,124,255,.16),
            transparent 38%
        ),
        radial-gradient(
            circle at 100% 50%,
            rgba(92,70,190,.07),
            transparent 35%
        ),
        var(--bg);

    overflow-x:hidden;
}

/* =========================
   SCROLLBAR
   ========================= */

::-webkit-scrollbar{
    width:5px;
}

::-webkit-scrollbar-track{
    background:transparent;
}

::-webkit-scrollbar-thumb{
    background:#292932;
    border-radius:999px;
}

::-webkit-scrollbar-thumb:hover{
    background:#454550;
}

::-webkit-scrollbar-corner{
    background:transparent;
}

/* =========================
   CONTAINER
   ========================= */

.container{
    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:
        28px
        16px
        50px;
}

/* =========================
   CARD PRINCIPAL
   ========================= */

.card{
    width:100%;
    max-width:470px;

    padding:24px 18px;

    animation:fade .55s ease;

    position:relative;
}

/* brilho discreto atrás do conteúdo */

.card::before{
    content:"";

    position:fixed;

    width:300px;
    height:300px;

    top:-180px;
    left:50%;

    transform:translateX(-50%);

    border-radius:50%;

    background:rgba(123,104,238,.08);

    filter:blur(70px);

    pointer-events:none;
}

/* =========================
   LISTA
   ========================= */

.buttons{
    width:100%;

    display:flex;
    flex-direction:column;

    gap:11px;

    position:relative;
    z-index:1;
}

/* =========================
   TÍTULOS
   ========================= */

.title{
    margin-top:24px;
    margin-bottom:4px;

    padding-left:5px;

    color:#d9d9e2;

    font-size:13px;
    font-weight:700;

    letter-spacing:.7px;

    text-transform:uppercase;

    animation:fade .5s ease;
}

.title:first-child{
    margin-top:4px;
}

.title::before{
    content:"";

    display:inline-block;

    width:5px;
    height:5px;

    margin-right:8px;

    vertical-align:middle;

    border-radius:50%;

    background:var(--primary);

    box-shadow:
        0 0 10px rgba(139,124,255,.8);
}

/* =========================
   BOTÕES
   ========================= */

.btn{
    width:100%;
    min-height:76px;

    position:relative;
    overflow:hidden;

    padding:8px;

    border:1px solid var(--border);
    outline:none;

    border-radius:220px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.025),
            rgba(255,255,255,.008)
        ),
        var(--button);

    color:white;

    cursor:pointer;

    transition:
        transform .16s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}

/* brilho passando pelo botão */

.btn::before{
    content:"";

    position:absolute;

    width:80px;
    height:160%;

    top:-30%;

    left:-120px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.055),
            transparent
        );

    transform:rotate(15deg);

    pointer-events:none;
}

.btn:hover{
    background:
        linear-gradient(
            145deg,
            rgba(139,124,255,.07),
            rgba(255,255,255,.015)
        ),
        var(--button-hover);

    border-color:var(--border-hover);

    box-shadow:
        0 10px 30px rgba(0,0,0,.22),
        0 0 20px rgba(139,124,255,.07);
}

.btn:hover::before{
    animation:shine .65s ease;
}

.btn:active{
    transform:scale(.965);

    background:#1b1b23;

    box-shadow:
        0 5px 15px rgba(0,0,0,.3);
}

/* =========================
   CONTEÚDO DO BOTÃO
   ========================= */

.left{
    width:100%;
    min-height:60px;

    display:flex;
    align-items:center;

    position:relative;
}

/* =========================
   ÍCONE
   ========================= */

.emoji{
    position:absolute;

    left:6px;

    width:56px;
    height:56px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:107px;

    background:
        linear-gradient(
            145deg,
            rgba(139,124,255,.17),
            rgba(139,124,255,.045)
        );

    border:
        1px solid rgba(139,124,255,.15);

    transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.btn:hover .emoji{
    transform:scale(1.06);

    background:
        linear-gradient(
            145deg,
            rgba(139,124,255,.25),
            rgba(139,124,255,.07)
        );

    box-shadow:
        0 0 20px rgba(139,124,255,.10);
}

.emoji img{
    width:34px;
    height:34px;

    object-fit:contain;

    display:block;
}

/* =========================
   TEXTO
   ========================= */

.btn span{
    display:block;

    width:100%;

    padding:
        0
        60px
        0
        82px;

    text-align:left;

    color:#f5f5f8;

    font-size:15px;
    font-weight:700;

    line-height:1.3;

    letter-spacing:.05px;

    transition:
        color .2s ease,
        transform .2s ease;
}

.btn:hover span{
    color:#fff;
    transform:translateX(2px);
}

/* =========================
   SETA DISCRETA
   ========================= */

.btn::after{
    content:"›";

    position:absolute;

    right:20px;
    top:50%;

    transform:
        translateY(-50%);

    color:#555562;

    font-size:26px;
    font-weight:400;

    transition:
        color .2s ease,
        transform .2s ease;
}

.btn:hover::after{
    color:var(--primary-light);

    transform:
        translate(3px,-50%);
}

/* =========================
   FOOTER
   ========================= */

.footer{
    margin-top:34px;

    padding-top:18px;

    border-top:
        1px solid rgba(255,255,255,.055);

    text-align:center;

    color:#555560;

    font-size:11px;

    letter-spacing:.5px;
}

/* =========================
   SELEÇÃO
   ========================= */

::selection{
    color:white;

    background:
        rgba(139,124,255,.35);
}

/* =========================
   ACESSIBILIDADE
   ========================= */

button:focus-visible{
    outline:
        2px solid var(--primary);

    outline-offset:3px;
}

/* =========================
   CELULARES
   ========================= */

@media(max-width:420px){

    .container{
        padding:
            18px
            12px
            40px;
    }

    .card{
        padding:
            18px
            4px;
    }

    .buttons{
        gap:10px;
    }

    .title{
        margin-top:22px;

        font-size:11px;
    }

    .btn{
        min-height:72px;

        border-radius:200px;
    }

    .left{
        min-height:56px;
    }

    .emoji{
        width:52px;
        height:52px;

        left:5px;

        border-radius:16px;
    }

    .emoji img{
        width:31px;
        height:31px;
    }

    .btn span{
        padding-left:76px;
        padding-right:48px;

        font-size:14px;
    }

    .btn::after{
        right:16px;

        font-size:24px;
    }

    .footer{
        margin-top:28px;

        font-size:10px;
    }
}

/* =========================
   TELAS MUITO PEQUENAS
   ========================= */

@media(max-width:340px){

    .container{
        padding-left:9px;
        padding-right:9px;
    }

    .btn{
        min-height:68px;
    }

    .emoji{
        width:48px;
        height:48px;
    }

    .emoji img{
        width:28px;
        height:28px;
    }

    .btn span{
        padding-left:68px;

        font-size:13px;
    }
}

/* =========================
   REDUÇÃO DE MOVIMENTO
   ========================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none !important;
        transition:none !important;
    }
}
</style>

</head>

<body>

<div class="container">

    <main class="card">



        <div class="buttons">

            <div class="title">

            </div>

            <button class="btn" onclick="ir('calendario.html')">
                <div class="left">
                    <div class="emoji">
                        <img src="2.svg" alt="">
                    </div>
                    <span>Calendário menstrual</span>
                </div>
            </button>

            <button class="btn" onclick="ir('calendar.html')">
                <div class="left">
                    <div class="emoji">
                        <img src="3.svg" alt="">
                    </div>
                    <span>Calendário de eventos</span>
                </div>
            </button>

            <button class="btn" onclick="ir('mapa.html')">
                <div class="left">
                    <div class="emoji">
                        <img src="4.svg" alt="">
                    </div>
                    <span>Mapa da sua região</span>
                </div>
            </button>

            <button class="btn" onclick="ir('caderno.html')">
                <div class="left">
                    <div class="emoji">
                        <img src="5.svg" alt="">
                    </div>
                    <span>Diário e anotações</span>
                </div>
            </button>

            <button class="btn" onclick="ir('treino.html')">
                <div class="left">
                    <div class="emoji">
                        <img src="6.svg" alt="">
                    </div>
                    <span>Rotina gamificada</span>
                </div>
            </button>

            <button class="btn" onclick="ir('daora.html')">
                <div class="left">
                    <div class="emoji">
                        <img src="7.svg" alt="">
                    </div>
                    <span>Relógio + Localização</span>
                </div>
            </button>

            <button class="btn" onclick="ir('calc.html')">
                <div class="left">
                    <div class="emoji">
                        <img src="8.svg" alt="">
                    </div>
                    <span>Calculadora</span>
                </div>
            </button>

            <button class="btn" onclick="ir('task.html')">
                <div class="left">
                    <div class="emoji">
                        <img src="9.svg" alt="">
                    </div>
                    <span>Minhas tarefas</span>
                </div>
            </button>

            <div class="title">
                Funções em telas separadas:
            </div>

            <button class="btn" onclick="Android.openRecorder()">
                <div class="left">

                        <img src="10.svg" alt="">
                    </div>
                    <span>Gravador de voz</span>

            <button class="btn" onclick="Android.openFiles()">
                <div class="left">
                    <div class="emoji">

                    </div>

            <button class="btn" onclick="Android.abrirEscolherIcone()">
                <div class="left">
                    <div class="emoji">

                    </div>

            <div class="title">

            <button class="btn" onclick="ativarEbloquear()">

               Aplicativos:
            </div>
            
                        <button class="btn" onclick="location.href='pesquisar.html'">
                <div class="left">

                    </div>

            <div class="title">
                Nossos outros aplicativos:
            </div>

            <button class="btn" onclick="Android.abrirPorIntent()">
                <div class="left">

                        <img src="assist.png" alt="">

                    <span>Assistente de voz</span>
                </div>
            </button>

            <button class="btn" onclick="Android.abrirGerenciador()">
                <div class="left">

                        <img src="gerenciar.png" alt="">

                    <span>Gerenciador de arquivos</span>
                </div>
            </button>


        </div>

        <div class="footer">
            Secured By • Mulher Amparada
        </div>

    </main>

</div>

<script>

const lock = new Audio("lock.mp3");

lock.preload = "auto";
lock.volume = 1;

let bloqueado = false;

function tocarSom(callback){

    if(bloqueado) return;

    bloqueado = true;

    lock.currentTime = 0;

    const play = lock.play();

    if(play){

        play
        .then(()=>{

            setTimeout(callback,400);

        })
        .catch(callback);

    }else{

        callback();

    }

}

function ir(pagina){

    tocarSom(()=>{

        location.href = pagina;

    });

}

function definirWallpaper(){

    let wallpaper="";

    try{

        wallpaper=Android.getWallpaperUrl();

    }catch(e){}

    if(wallpaper){

        document.body.style.backgroundImage=`url('${wallpaper}')`;
        document.body.style.backgroundPosition="center";
        document.body.style.backgroundSize="cover";
        document.body.style.backgroundRepeat="no-repeat";
        document.body.style.backgroundAttachment="fixed";

    }else{

        document.body.style.background="#000";

    }

}

function ativarEbloquear(){

    if(typeof Android==="undefined") return;

    try{

        Android.solicitarAdministrador();

        Android.bloquearTela();

    }catch(e){}

}

window.addEventListener("load",()=>{

    definirWallpaper();

});

window.addEventListener("beforeunload",()=>{

    try{

        lock.currentTime=0;
        lock.play();

    }catch(e){}

});

</script>

</body>
</html>
