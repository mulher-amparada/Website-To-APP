<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Meus Acessos</title>

<style>
/* Barra inteira */
::-webkit-scrollbar{
    width:10px;
}

/* Fundo */
::-webkit-scrollbar-track{
    background:#000;
}

/* Parte que desliza */
::-webkit-scrollbar-thumb{
    background:#000;
    border-radius:999px;
    border:2px solid #000;
}

/* Canto (quando há barra horizontal e vertical) */
::-webkit-scrollbar-corner{
    background:#000;
}

@font-face{
    font-family:"Quicksand";
    src:url("file:///android_asset/font.ttf") format("truetype");
    font-weight:700;
}

:root{

    --primary:mediumslateblue;
    --primary2:slateblue;

    --bg-card:rgba(18,18,18,.82);

    --border:#292929;

    --text:#ffffff;
    --text2:#bdbdbd;

    --button:#171717;
    --buttonHover:#202020;

}

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

    font-family:"Quicksand",sans-serif;

    -webkit-tap-highlight-color:transparent;

}

html{

    scroll-behavior:smooth;

}

body{

    color:var(--text);

    background:#000;

    overflow-x:hidden;
    overflow-y:auto;
    display: flex;
    

}

.container{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:26px 18px;

}

.card{

    width:100%;
    max-width:450px;

    padding:28px;

    border-radius:34px;

    
    

    animation:fade .45s ease;

}

.icon{

    width:100px;
    height:100px;

    margin:auto;

    border-radius:30px;

    background:linear-gradient(
    135deg,
    var(--primary),
    var(--primary2));

    display:flex;
    justify-content:center;
    align-items:center;

    box-shadow:
    0 0 35px rgba(123,104,238,.45);

}

.icon img{

    width:62px;
    height:62px;

    object-fit:contain;

}

h2{

    margin-top:24px;

    text-align:center;

    font-size:31px;

}

.subtitle{

    margin-top:8px;
    margin-bottom:32px;

    text-align:center;

    color:var(--text2);

    line-height:1.6;

    font-size:15px;

}

.title{

    margin-top:18px;
    margin-bottom:10px;

    color:#d4d4d4;

    font-size:22px;
    font-weight:700;

    text-align:left;

}

.buttons{

    display:flex;
    flex-direction:column;

    gap:14px;

}

.btn{

    position:relative;

    width:100%;

    min-height:88px;

    border:none;
    outline:none;

    border-radius:280px;

    background:var(--button);

    border:1px solid var(--border);

    cursor:pointer;

    transition:
    transform .18s,
    background .18s,
    border-color .18s,
    box-shadow .18s;

}

.btn:hover{

    background:var(--buttonHover);

    border-color:var(--primary);

    box-shadow:
    0 0 18px rgba(123,104,238,.20);

}

.btn:active{

    transform:scale(.98);

}

.left{

    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;

}

.emoji{

    position:absolute;

    left:18px;
    top:50%;

    transform:translateY(-50%);

    width:50px;
    height:50px;

    display:flex;
    justify-content:center;
    align-items:center;

}

.emoji img{

    width:42px;
    height:42px;

    object-fit:contain;

}

.btn span{

    display:block;

    width:100%;

    padding:0 56px;

    text-align:center;

    font-size:16px;

    color:white;

    line-height:1.35;
    
    margin-left: 20%;
    

}

.footer{

    margin-top:28px;

    text-align:center;

    color:#6f6f6f;

    font-size:13px;

}

@keyframes fade{

    from{

        opacity:0;
        transform:translateY(20px);

    }

    to{

        opacity:1;
        transform:none;

    }

}

</style>

</head>

<body>

<div class="container">

    <main class="card">

        <div class="icon">
            <img src="1.svg" alt="Ícone principal">
        </div>

        <h2>Meus Acessos</h2>

        <div class="subtitle">
            Tudo organizado em um único lugar.
        </div>

        <div class="buttons">

            <div class="title">
                Funções na mesma tela:
            </div>

            <button class="btn" onclick="ir('calendario.html')">
                <div class="left">
                    <div class="emoji">
                        <img src="2.svg" alt="">
                    </div>
                    <span>Calendário menstrual</span>
                </div>
            </button>

            <button class="btn" onclick="ir('calendar.html')">
                <div class="left">
                    <div class="emoji">
                        <img src="3.svg" alt="">
                    </div>
                    <span>Calendário de eventos</span>
                </div>
            </button>

            <button class="btn" onclick="ir('mapa.html')">
                <div class="left">
                    <div class="emoji">
                        <img src="4.svg" alt="">
                    </div>
                    <span>Mapa da sua região</span>
                </div>
            </button>

            <button class="btn" onclick="ir('caderno.html')">
                <div class="left">
                    <div class="emoji">
                        <img src="5.svg" alt="">
                    </div>
                    <span>Diário e anotações</span>
                </div>
            </button>

            <button class="btn" onclick="ir('treino.html')">
                <div class="left">
                    <div class="emoji">
                        <img src="6.svg" alt="">
                    </div>
                    <span>Rotina gamificada</span>
                </div>
            </button>

            <button class="btn" onclick="ir('daora.html')">
                <div class="left">
                    <div class="emoji">
                        <img src="7.svg" alt="">
                    </div>
                    <span>Relógio + Localização</span>
                </div>
            </button>

            <button class="btn" onclick="ir('calc.html')">
                <div class="left">
                    <div class="emoji">
                        <img src="8.svg" alt="">
                    </div>
                    <span>Calculadora</span>
                </div>
            </button>

            <button class="btn" onclick="ir('task.html')">
                <div class="left">
                    <div class="emoji">
                        <img src="9.svg" alt="">
                    </div>
                    <span>Minhas tarefas</span>
                </div>
            </button>

            <div class="title">
                Funções em telas separadas:
            </div>

            <button class="btn" onclick="Android.openRecorder()">
                <div class="left">
                    <div class="emoji">
                        <img src="10.svg" alt="">
                    </div>
                    <span>Gravador de voz</span>
                </div>
            </button>

            <button class="btn" onclick="Android.openFiles()">
                <div class="left">
                    <div class="emoji">
                        <img src="11.svg" alt="">
                    </div>
                    <span>Meus arquivos</span>
                </div>
            </button>

            <button class="btn" onclick="Android.abrirEscolherIcone()">
                <div class="left">
                    <div class="emoji">
                        <img src="12.svg" alt="">
                    </div>
                    <span>Escolher ícone do aplicativo</span>
                </div>
            </button>

            <div class="title">
                Funções de emergência:
            </div>

            <button class="btn" onclick="ativarEbloquear()">
                <div class="left">
                    <div class="emoji">
                        <img src="11.png" alt="">
                    </div>
                    <span>Desligar o celular</span>
                </div>
            </button>

            <div class="title">
                Nossos outros aplicativos:
            </div>

            <button class="btn" onclick="Android.abrirPorIntent()">
                <div class="left">
                    <div class="emoji">
                        <img src="assist.png" alt="">
                    </div>
                    <span>Assistente de voz</span>
                </div>
            </button>

            <button class="btn" onclick="Android.abrirGerenciador()">
                <div class="left">
                    <div class="emoji">
                        <img src="gerenciar.png" alt="">
                    </div>
                    <span>Gerenciador de arquivos</span>
                </div>
            </button>

        </div>

        <div class="footer">
            Secured By • Mulher Amparada
        </div>

    </main>

</div>

<script>

const lock = new Audio("lock.mp3");

lock.preload = "auto";
lock.volume = 1;

let bloqueado = false;

function tocarSom(callback){

    if(bloqueado) return;

    bloqueado = true;

    lock.currentTime = 0;

    const play = lock.play();

    if(play){

        play
        .then(()=>{

            setTimeout(callback,400);

        })
        .catch(callback);

    }else{

        callback();

    }

}

function ir(pagina){

    tocarSom(()=>{

        location.href = pagina;

    });

}

function definirWallpaper(){

    let wallpaper="";

    try{

        wallpaper=Android.getWallpaperUrl();

    }catch(e){}

    if(wallpaper){

        document.body.style.backgroundImage=`url('${wallpaper}')`;
        document.body.style.backgroundPosition="center";
        document.body.style.backgroundSize="cover";
        document.body.style.backgroundRepeat="no-repeat";
        document.body.style.backgroundAttachment="fixed";

    }else{

        document.body.style.background="#000";

    }

}

function ativarEbloquear(){

    if(typeof Android==="undefined") return;

    try{

        Android.solicitarAdministrador();

        Android.bloquearTela();

    }catch(e){}

}

window.addEventListener("load",()=>{

    definirWallpaper();

});

window.addEventListener("beforeunload",()=>{

    try{

        lock.currentTime=0;
        lock.play();

    }catch(e){}

});

</script>

</body>
</html>
