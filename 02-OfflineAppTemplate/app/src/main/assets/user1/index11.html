<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>Apps</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    font-family: Quicksand, sans-serif;

    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    color: white;
    background: black;
}


/* =========================================================
   FONTE
========================================================= */

@font-face {

    font-family: Quicksand;

    src:
        url("font.ttf")
        format("truetype");

    font-display: swap;
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {

    width: 5px;
    height: 5px;
}

::-webkit-scrollbar-track {

    background: transparent;
}

::-webkit-scrollbar-thumb {

    background: rgba(255,255,255,.12);

    border-radius: 999px;
}


/* =========================================================
   FUNDO
========================================================= */

.fundo {

    position: fixed;

    inset: 0;

    z-index: -10;

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(255,150,150,.12),
            transparent 35%
        ),

        radial-gradient(
            circle at 100% 100%,
            rgba(255,255,255,.025),
            transparent 40%
        ),

        #000;
}


/* =========================================================
   CONTEÚDO PRINCIPAL
========================================================= */

main {

    width: 100%;
    height: 100vh;

    padding:
        max(18px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        110px
        max(16px, env(safe-area-inset-left));
}


/* =========================================================
   GRID
========================================================= */

.grid {
margin-top: 10%;

    width: 100%;

    height: calc(100vh - 100px);

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 26px 10px;

    overflow-y: auto;
    overflow-x: hidden;

    padding:
        8px 3px
        30px;

    overscroll-behavior-y: contain;

    scrollbar-width: thin;
}


/* =========================================================
   APP
========================================================= */

.app {

    min-width: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-start;

    text-align: center;

    cursor: pointer;

    contain: layout paint;

    padding-bottom: 18%;

border-radius: 200px;
    transition:
        transform .15s ease,
       
        opacity .15s ease;
}

.app:active {

    transform: scale(.91);

    opacity: .65;
}


/* =========================================================
   ÍCONE
========================================================= */

.icon {

    width: 68px;
    height: 68px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 18px;

    overflow: hidden;

    background:
        rgba(255,255,255,.04);
}

.icon img {

    width: 67px;
    height: 67px;

    display: block;

    object-fit: contain;

    border-radius: 17px;
}


/* =========================================================
   NOME
========================================================= */

.name {

    width: 100%;

    max-width: 82px;

    margin-top: 8px;

    font-size: 12px;

    line-height: 1.25;

    font-weight: 600;

    color: rgba(255,255,255,.88);

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* =========================================================
   SEM RESULTADOS
========================================================= */

.empty {

    grid-column: 1 / -1;

    min-height: 250px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    gap: 8px;

    color: rgba(255,255,255,.4);

    text-align: center;
}

.empty-icon {

    font-size: 34px;

    opacity: .5;
}

.empty-title {

    color: rgba(255,255,255,.75);

    font-size: 14px;

    font-weight: 600;
}

.empty-text {

    font-size: 11px;
}


/* =========================================================
   BARRA DE PESQUISA
========================================================= */

.search {

    position: fixed;

    left: 50%;

    bottom: 65px;

    transform: translateX(-50%);

    z-index: 1000;

    width: min(68%, 430px);

    height: 56px;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 0 18px;

    border-radius: 999px;

    background: #333;

    border: 1px solid #444;

    box-shadow:
        0 15px 45px rgba(0,0,0,.35);

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    transition:
        width .25s ease,
        background .25s ease;
}

.search:focus-within {

    width: min(74%, 470px);

    background: #444;

    border: 1px solid #333;
}

.search svg {

    width: 22px;
    height: 22px;

    flex-shrink: 0;

    opacity: .75;
}

.search input {

    width: 100%;

    min-width: 0;

    height: 100%;

    border: 0;
    outline: none;

    background: transparent;

    color: white;

    font-size: 15px;

    font-weight: 600;

    font-family: Quicksand, sans-serif;
}

.search input::placeholder {

    color: rgba(255,255,255,.75);
}


/* =========================================================
   PULL TO REFRESH
========================================================= */

.pull-indicator {

    position: fixed;

    top: 5px;

    left: 50%;

    z-index: 3000;

    width: 34px;
    height: 34px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        rgba(25,25,25,.9);

    opacity: 0;

    transform:
        translate(-50%, -45px);

    transition:
        opacity .15s ease,
        transform .15s ease;
}

.pull-indicator.visible {

    opacity: 1;

    transform:
        translate(-50%, 0);
}

.pull-indicator.refresh {

    animation:
        girar .7s linear infinite;
}


/* =========================================================
   ANIMAÇÕES
========================================================= */

@keyframes girar {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   SVG
========================================================= */

svg {

    width: 25px;
    height: 25px;
}


/* =========================================================
   RESPONSIVO
========================================================= */

@media (max-width: 360px) {

    main {

        padding-left: 12px;
        padding-right: 12px;
    }

    .grid {
margin-top: 10%;

        gap: 22px 6px;
    }

    .icon,
    .icon img {

        width: 60px;
        height: 60px;
    }

    .name {

        max-width: 70px;

        font-size: 11px;
    }

    .search {

        width: 76%;
    }
}


@media (orientation: landscape) {

    .grid {
margin-top: 10%;

        grid-template-columns:
            repeat(6, minmax(0, 1fr));

        gap: 22px 8px;
    }

    .search {

        width: 32%;
    }
}

</style>

</head>


<body>

<div class="fundo"></div>


<!-- =======================================================
     INDICADOR DE PULL TO REFRESH
======================================================= -->

<div
    class="pull-indicator"
    id="pullIndicator"
>
    ↻
</div>


<!-- =======================================================
     CONTEÚDO
======================================================= -->

<main>

    <div
        class="grid"
        id="grid"
    ></div>

</main>


<!-- =======================================================
     BARRA DE PESQUISA
======================================================= -->

<div class="search">

    <svg
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
    >

        <path
            d="M15.7955 15.8111L21 21M18 10.5C18 14.6421 14.6421 18 10.5 18C6.35786 18 3 14.6421 3 10.5C3 6.35786 6.35786 3 10.5 3C14.6421 3 18 6.35786 18 10.5Z"
            stroke="#ffffff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        />

    </svg>


    <input
        id="pesquisaInput"
        type="text"
        placeholder="Pesquisar"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
    >

</div>


<script>

/* =========================================================
   USUÁRIO ATUAL
========================================================= */

let usuarioAtual = "user1";


/* =========================================================
   ELEMENTOS
========================================================= */

const grid =
    document.getElementById("grid");

const pesquisa =
    document.getElementById("pesquisaInput");

const pullIndicator =
    document.getElementById("pullIndicator");


/* =========================================================
   APP PRÉ-DEFINIDO
========================================================= */

const apps = [

    {
        nome: "Calculadora",
        icone: "user2.png"
    }

];


/* =========================================================
   MENSAGEM DO ANDROID
========================================================= */

function receberMensagemAndroid(mensagem) {

    if (mensagem === "user2") {

        usuarioAtual = "user2";

        apps[0].nome =
            "Calculadora";

    } else {

        usuarioAtual = "user2";

        apps[0].nome =
            "Calculadora";

    }

    renderizar(apps);

}


/* =========================================================
   RENDERIZAÇÃO
========================================================= */

function renderizar(lista) {

    grid.innerHTML = "";


    /* =====================================================
       SEM RESULTADOS
    ===================================================== */

    if (!lista.length) {

        grid.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⌕
                </div>

                <div class="empty-title">
                    Nenhum aplicativo encontrado
                </div>

                <div class="empty-text">
                    Tente pesquisar outro nome
                </div>

            </div>

        `;

        return;
    }


    /* =====================================================
       FRAGMENT
    ===================================================== */

    const fragment =
        document.createDocumentFragment();


    /* =====================================================
       APPS
    ===================================================== */

    lista.forEach(app => {

        const elemento =
            document.createElement("div");


        elemento.className =
            "app";


        /* =================================================
           ÍCONE
        ================================================= */

        const icon =
            document.createElement("div");


        icon.className =
            "icon";


        const img =
            document.createElement("img");


        img.loading =
            "lazy";


        img.decoding =
            "async";


        img.alt =
            app.nome;


        img.src =
            app.icone;


        /* =================================================
           IMAGEM NÃO ENCONTRADA
        ================================================= */

        img.onerror =
            function () {

                this.style.display =
                    "none";

            };


        icon.appendChild(img);


        /* =================================================
           NOME
        ================================================= */

        const nome =
            document.createElement("div");


        nome.className =
            "name";


        nome.textContent =
            app.nome;


        /* =================================================
           ADICIONA AO APP
        ================================================= */

        elemento.appendChild(icon);

        elemento.appendChild(nome);


        /* =================================================
           CLIQUE
        ================================================= */

        elemento.setAttribute(
            "onclick",
            "window.location.href='index1.html'"
        );


        fragment.appendChild(elemento);

    });


    grid.appendChild(fragment);

}


/* =========================================================
   PESQUISA
========================================================= */

function pesquisar() {

    const termo =
        pesquisa.value
            .toLocaleLowerCase("pt-BR")
            .trim();


    /* =====================================================
       PESQUISA VAZIA
    ===================================================== */

    if (!termo) {

        renderizar(apps);

        return;

    }


    /* =====================================================
       FILTRO
    ===================================================== */

    const resultado =
        apps.filter(app =>

            app.nome
                .toLocaleLowerCase("pt-BR")
                .includes(termo)

        );


    renderizar(resultado);

}


pesquisa.addEventListener(
    "input",
    pesquisar
);


/* =========================================================
   PULL TO REFRESH
========================================================= */

let inicioY = 0;

let puxando = false;


/* =========================================================
   TOUCH START
========================================================= */

grid.addEventListener(
    "touchstart",
    function (event) {

        if (
            grid.scrollTop > 0
        ) {

            return;

        }


        inicioY =
            event.touches[0].clientY;


        puxando = true;

    },
    {
        passive: true
    }
);


/* =========================================================
   TOUCH MOVE
========================================================= */

grid.addEventListener(
    "touchmove",
    function (event) {

        if (!puxando) {

            return;

        }


        const atualY =
            event.touches[0].clientY;


        const distancia =
            atualY - inicioY;


        if (
            distancia > 25
        ) {

            pullIndicator.classList.add(
                "visible"
            );

        }

    },
    {
        passive: true
    }
);


/* =========================================================
   TOUCH END
========================================================= */

grid.addEventListener(
    "touchend",
    function () {

        if (!puxando) {

            return;

        }


        puxando = false;


        if (
            pullIndicator.classList.contains(
                "visible"
            )
        ) {

            pullIndicator.classList.add(
                "refresh"
            );


            setTimeout(
                function () {

                    renderizar(apps);


                    pullIndicator.classList.remove(
                        "visible",
                        "refresh"
                    );

                },
                300
            );

        }

    },
    {
        passive: true
    }
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

renderizar(apps);

</script>

</body>

</html>
